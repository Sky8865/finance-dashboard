<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Loot Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--card:#131215;--line:#2b2619;--ink:#f3ead8;--mute:#9a8f78;--a1:#e3b84a;--a2:#b8862b;--a3:#d2792f;--hero:#1e1810;--gl:#e3b84a30;--gr:#8fe388;--rd:#ff5d5d;--go:#ffd23f;color-scheme:dark}
html[data-t=emerald]{--bg:#06100d;--card:#0d1b17;--line:#1f3a31;--ink:#e6f5ee;--mute:#7fa394;--a1:#3ddc97;--a2:#1f9d6b;--a3:#c6e84a;--hero:#0f2a21;--gl:#3ddc9730}
html[data-t=royal]{--bg:#0a0614;--card:#140d2b;--line:#2d1f5e;--ink:#eae6ff;--mute:#8f86b8;--a1:#22e4ff;--a2:#8b5cf6;--a3:#ff2e97;--hero:#271456;--gl:#8b5cf655;--gr:#a3ff3c}
html[data-t=crimson]{--bg:#0d0708;--card:#1a0e10;--line:#3a1b20;--ink:#f6e8e9;--mute:#a58389;--a1:#ff5a6a;--a2:#b3202f;--a3:#ff9a5a;--hero:#2c0f14;--gl:#ff5a6a30}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(800px 380px at 85% -8%,var(--gl),transparent),radial-gradient(600px 380px at -10% 8%,var(--gl),transparent),var(--bg);color:var(--ink);font:500 17px/1.4 Rajdhani,system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top,0) 0 calc(28px + env(safe-area-inset-bottom,0));font-variant-numeric:tabular-nums;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:14px}
.f,h2,.big{font-family:Orbitron,system-ui,sans-serif}
h2{font-size:13px;letter-spacing:.06em;margin:22px 0 10px;color:var(--a1);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
small,.mute{color:var(--mute);font-size:13.5px}
.card,.tile{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,#fff),var(--card));border:1px solid var(--line);border-radius:16px}
.card{padding:4px 14px}.pad{padding:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{position:relative;overflow:hidden;padding:12px 12px 12px 16px}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--a1),var(--a3))}
.tile b{display:block;font-size:17px;margin-top:2px}
.hero{border:1px solid var(--a2);border-radius:18px;padding:16px;background:linear-gradient(135deg,var(--hero),var(--card));box-shadow:0 0 24px var(--gl)}
.hr{display:flex;justify-content:space-between;align-items:center;gap:12px}
.big{font-size:30px;font-weight:800;color:var(--a1);text-shadow:0 0 14px var(--gl);margin:2px 0 4px;word-break:break-all}
.ring{flex:none;width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--a1) var(--p),var(--line) 0);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring::before{content:"";position:absolute;inset:6px;background:var(--hero);border-radius:50%}
.ring>*{position:relative;line-height:1}.ring b{font-size:24px;color:var(--a1)}.ring small{font-size:9px;margin-top:2px}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:14px 0 8px;background:var(--bg)}.stack i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mute);margin-bottom:8px}.leg u{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.bar{height:11px;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a2),var(--a1));box-shadow:0 0 10px var(--gl);transition:width .4s}
.bar.pk i{background:linear-gradient(90deg,var(--a3),var(--go));box-shadow:0 0 10px var(--gl)}
.bar.gr i{background:linear-gradient(90deg,#27c46b,var(--gr))}
.bar.bad i{background:var(--rd)}
.bd{display:flex;flex-wrap:wrap;gap:8px}
.bd span{padding:6px 11px;border-radius:20px;border:1px solid var(--line);font-size:14px;color:var(--mute);filter:grayscale(1);opacity:.55}
.bd span.on{filter:none;opacity:1;color:var(--ink);border-color:var(--a1);box-shadow:0 0 10px var(--gl)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.grow{flex:1;min-width:0}.row small{display:block}
.amt{font-weight:700;white-space:nowrap}.r{text-align:right}
.p{color:var(--gr)}.n{color:var(--rd)}.tot{font-weight:700}
.x{background:none;border:0;color:var(--mute);font-size:22px;padding:2px 6px;cursor:pointer}
form{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;flex:1 1 90px}
input:focus,select:focus{outline:0;border-color:var(--a1);box-shadow:0 0 8px var(--gl)}
.btn{font:inherit;font-weight:700;background:linear-gradient(90deg,var(--a3),var(--a1));color:var(--bg);border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--a1)}
.cv{flex:none;width:110px;text-align:right;padding:7px 9px}
.lb{flex:1 1 140px;font-size:13px;color:var(--mute)}.lb input{width:100%;margin-top:3px}
.mc{padding:12px;margin-bottom:10px}
.mc .h{display:flex;justify-content:space-between;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.g2 label{font-size:13px;color:var(--mute)}.g2 input{width:100%;margin-top:3px;padding:8px 10px}
.cat{display:grid;grid-template-columns:100px 1fr 76px;gap:8px;align-items:center;font-size:15px;margin:6px 0}
.cat .bar{margin:0}.cat span:last-child{text-align:right}
.empty{color:var(--mute);padding:12px 0;font-size:15px}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);cursor:pointer}.sw.on{border-color:var(--ink);box-shadow:0 0 10px var(--gl)}
.top{position:sticky;top:0;z-index:4;margin:-14px -14px 14px;padding:12px 14px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tl{display:flex;justify-content:space-between;align-items:center;gap:10px;font:800 17px Orbitron,system-ui}
.tl span{color:var(--a3)}
.qa{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--a3),var(--a2));color:var(--bg);font:700 24px system-ui;line-height:1;box-shadow:0 0 14px var(--gl);cursor:pointer}
.status{font:500 14px Rajdhani,system-ui;color:var(--mute)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:2px 0;width:100%}.tabs::-webkit-scrollbar{display:none}
.tabs button{min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;font:700 14px Rajdhani,system-ui;letter-spacing:.02em;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.2s}
.tabs button.on{color:var(--bg);background:linear-gradient(90deg,var(--a1),var(--a3));border-color:transparent;box-shadow:0 0 14px var(--gl)}
#sheet{position:fixed;inset:0;z-index:9;display:none;background:#000b;align-items:flex-end}
#sheet.open{display:flex}
#sheet>div{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.in{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><main id="app"></main><div id="sheet"><div></div></div>
<script>
var KEY='paisa-tracker-v1',Y=new Date().getFullYear(),MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
CATS=['🍔 Food','🏠 Bills','⛽ Travel','🛒 Shopping','🎮 Fun','💊 Health','💳 EMI','📦 Other'],tab='home';
var blank=()=>({opening:[],months:[],exp:[],sip:[],ins:[],mf:[],st:[],gold:[],fds:[],goals:[],rec:[],debts:[],target:0,budget:0,goldRate:0,manualRate:0,premium:0,theme:'noir',lastBackup:''});
function migrate(d){var s=Object.assign(blank(),d);if(!d.months&&Array.isArray(d.salary))s.months=d.salary.map((v,m)=>({k:Y+'-'+String(m+1).padStart(2,'0'),salary:v||0,planned:(d.planned||[])[m]||0})).filter(x=>x.salary||x.planned);return s}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&typeof d=='object')return migrate(d)}catch(e){}return blank()}
var S=load(),OK=true;
try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){OK=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){OK=false}}

var inr=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0),
clamp=p=>Math.max(0,Math.min(100,p)),
cls=n=>n<0?'n':'p',
pn=(d,b)=>(d<0?'−':'+')+inr(Math.abs(d))+' ('+(b?(d/b*100).toFixed(1):'0')+'%)',
bar=(p,c)=>`<div class="bar ${c||''}"><i style="width:${clamp(p)}%"></i></div>`,
del=(k,i)=>`<button class="x" data-act="del" data-k="${k}" data-i="${i}" aria-label="Delete">×</button>`,
today=()=>{var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
mExp=k=>sum(S.exp.filter(e=>e.d.startsWith(k)),e=>e.a),
saved=o=>o.planned||0,
active=o=>o.planned||0,
yearSaved=()=>sum(S.months,o=>saved(o)),
mlabel=k=>MO[+k.slice(5)-1]+' '+k.slice(0,4),
cash=()=>sum(S.opening,x=>x.a)+yearSaved(),
goldVal=()=>{var g=sum(S.gold,x=>x.g),r=S.goldRate||0;return r>0?g*r:sum(S.gold,x=>x.g*x.r)},
fdVal=(f,at)=>{if(!f.r||!f.s)return f.a;var t=Math.max(0,(new Date(at)-new Date(f.s))/315576e5);return f.a*Math.pow(1+f.r/400,4*t)},
fdNow=f=>fdVal(f,Math.min(Date.now(),new Date(f.m))),
fdEnd=f=>fdVal(f,f.m);
function avgExp(){var a=S.months.map(o=>mExp(o.k)).filter(x=>x>0);return a.length?sum(a)/a.length:0}

var GOLDERR=false;
function applyRec(){var ym=today().slice(0,7),ch=false;S.rec.forEach(r=>{if(r.last!==ym){S.exp.push({d:ym+'-'+String(r.day||1).padStart(2,'0'),c:r.c,n:r.n+' (auto)',a:r.a});r.last=ym;ch=true}});if(ch)save()}
function chart(){var L=[...S.months].sort((a,b)=>a.k<b.k?-1:1);if(!L.length)return '';var mx=Math.max(1,...L.map(o=>Math.max(o.planned||0,mExp(o.k)))),w=520/L.length;
 return `<h2>📊 Year at a glance</h2><div class="card pad"><svg viewBox="0 0 520 170" width="100%" role="img" aria-label="Savings and spending by month">${L.map((o,i)=>{var s=(o.planned||0)/mx*120,e=mExp(o.k)/mx*120,x=i*w+w*.12,bw=w*.34;return `<rect x="${x}" y="${140-s}" width="${bw}" height="${s}" rx="3" fill="var(--a1)"/><rect x="${x+bw+3}" y="${140-e}" width="${bw}" height="${e}" rx="3" fill="var(--a3)"/><text x="${x+bw+1.5}" y="158" font-size="11" fill="var(--mute)" text-anchor="middle">${MO[+o.k.slice(5)-1]}</text>`}).join('')}</svg><small><u style="color:var(--a1)">■</u> Savings &nbsp; <u style="color:var(--a3)">■</u> Spent</small></div>`}
function debtBlock(){var owe=sum(S.debts.filter(d=>d.dir=='owe'),d=>Math.max(0,d.a-(d.p||0))),due=sum(S.debts.filter(d=>d.dir=='due'),d=>Math.max(0,d.a-(d.p||0)));
 return `<h2>🤝 Debts</h2><div class="card">${S.debts.length?S.debts.map((d,i)=>{var rem=d.a-(d.p||0);return `<div class="row"><div class="grow">${esc(d.n)}<small>${d.dir=='owe'?'I owe':'Owed to me'} · total ${inr(d.a)}</small><small class="${rem<=0?'p':''}">${rem<=0?'✅ Settled':'Remaining '+inr(rem)}</small></div><input class="cv" data-dp="${i}" type="number" step="any" value="${d.p||0}" aria-label="Paid so far">${del('debts',i)}</div>`}).join(''):'<div class="empty">No debts. Add money you owe or are owed.</div>'}
 <div class="row tot"><div class="grow">I owe<small>Remaining</small></div><div class="amt n">${inr(owe)}</div></div><div class="row tot"><div class="grow">Owed to me<small>Remaining</small></div><div class="amt p">${inr(due)}</div></div></div>
 <form data-k="debts"><input name="n" placeholder="Name" required><input name="a" type="number" step="any" placeholder="Amount ₹" required><select name="dir"><option value="owe">I owe</option><option value="due">Owed to me</option></select><button class="btn">Add</button></form>
 <p class="mute" style="margin:6px 0 0">Type "Paid so far" in the box on a row. Debts show separately and do not change net worth.</p>`}
function downloadCSV(){var rows=[['Section','Date','Name','Category','Amount','Extra']];
 S.exp.forEach(e=>rows.push(['Expense',e.d,e.n,e.c||'',e.a,'']));
 S.months.forEach(o=>{rows.push(['Month',o.k,'Salary','',o.salary||0,'']);rows.push(['Month',o.k,'Savings','',o.planned||0,''])});
 S.fds.forEach(f=>rows.push(['FD',f.m,f.n,'',f.a,(f.r||0)+'% from '+(f.s||'')]));
 S.mf.forEach(x=>rows.push(['Mutual fund','',x.n,'',x.c,'invested '+x.i]));
 S.st.forEach(x=>rows.push(['Stock','',x.n,'',x.c,'invested '+x.i]));
 S.gold.forEach(x=>rows.push(['Gold',x.d,x.g+' gm','',x.g*x.r*(1+(x.gst||0)/100),'@ '+x.r+' + GST '+(x.gst||0)+'%']));
 S.sip.forEach(x=>rows.push(['SIP','',x.n,'',x.a,'monthly']));
 S.debts.forEach(d=>rows.push(['Debt','',d.n,d.dir,d.a,'paid '+(d.p||0)]));
 var csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
 var u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),l=document.createElement('a');l.href=u;l.download='loot-vault-'+today()+'.csv';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

function home(){
 var cs=cash(),mc=sum(S.mf,x=>x.c),sc=sum(S.st,x=>x.c),gv=goldVal(),fv=sum(S.fds,fdNow),sip=sum(S.sip,x=>x.a),
 nw=cs+mc+sc+gv+fv,lv=Math.floor(Math.max(nw,0)/1e5)+1,xp=Math.max(nw,0)%1e5/1e3,
 ys=yearSaved(),pct=S.target>0?ys/S.target*100:0,av=avgExp(),sh=av>0?cs/av:0,
 parts=[['Cash',cs,'--a1'],['Funds',mc,'--a2'],['Stocks',sc,'--a3'],['Gold',gv,'--go'],['FDs',fv,'--gr']],
 tt=sum(parts,p=>Math.max(p[1],0))||1,
 lat=[...S.months].sort((a,b)=>b.k<a.k?-1:1)[0],
 bs=[['💰','First ₹1L',nw>=1e5],['🛡️','Shield 3 mo',sh>=3],['🎯','Plan hit',!!lat&&lat.planned>0],['🧩','Diversified',parts.filter(p=>p[1]>0).length>=4],['🏆','Level 5',lv>=5]];
 var nag=(S.exp.length+S.opening.length+S.months.length+S.fds.length)>=5&&(!S.lastBackup||(Date.now()-new Date(S.lastBackup))/864e5>14);
 return `${nag?`<div class="card pad" style="margin-bottom:10px">💾 Backup due. Last one: ${S.lastBackup||'never'}. Tap Export below.</div>`:''}
 <div class="hero"><div class="hr"><div><small>TOTAL NET WORTH</small><div class="big">${inr(nw)}</div></div><div class="ring" style="--p:${xp*3.6}deg"><b class="f">${lv}</b><small>LVL</small></div></div>
 <div class="stack">${parts.map(p=>p[1]>0?`<i style="width:${p[1]/tt*100}%;background:var(${p[2]})"></i>`:'').join('')}</div>
 <div class="leg">${parts.map(p=>`<span><u style="background:var(${p[2]})"></u>${p[0]}</span>`).join('')}</div>
 <small>${xp.toFixed(0)}% to Level ${lv+1} · next at ${inr(lv*1e5)}</small></div>
 <div class="tiles"><div class="tile"><small>🏦 Cash savings</small><b class="f">${inr(cs)}</b></div><div class="tile"><small>📈 Mutual funds</small><b class="f">${inr(mc)}</b></div><div class="tile"><small>📊 Stocks</small><b class="f">${inr(sc)}</b></div><div class="tile"><small>🪙 Gold</small><b class="f">${inr(gv)}</b></div><div class="tile"><small>🔒 Fixed deposits</small><b class="f">${inr(fv)}</b></div><div class="tile"><small>🔁 SIP / month</small><b class="f">${inr(sip)}</b></div></div>
 <h2>🏅 Achievements</h2><div class="bd">${bs.map(b=>`<span class="${b[2]?'on':''}">${b[0]} ${b[1]}</span>`).join('')}</div>
 <h2>🎯 Goals</h2>
 <div class="card pad"><div style="display:flex;justify-content:space-between"><span>🚗 Car down payment</span><b>${clamp(pct).toFixed(0)}%</b></div>${bar(pct,'pk')}<small>Saved so far ${inr(ys)}</small>
 <input id="target" type="number" step="any" value="${S.target||''}" placeholder="🎯 Target ₹" style="width:100%;margin-top:8px"></div>
 ${S.goals.map((g,i)=>`<div class="card pad" style="margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:center"><span>${esc(g.n)}</span><span>${clamp(g.s/g.t*100).toFixed(0)}% ${del('goals',i)}</span></div>${bar(g.s/g.t*100,'gr')}<div style="display:flex;gap:8px;align-items:center"><small>Saved</small><input class="cv" data-gs="${i}" type="number" step="any" value="${g.s}"><small>of ${inr(g.t)}</small></div></div>`).join('')}
 <form data-k="goals"><input name="n" placeholder="New goal (Trip, PC…)" required><input name="t" type="number" step="any" placeholder="Target ₹" required><button class="btn">Add goal</button></form>
 <h2>🛡️ Emergency shield</h2><div class="card pad">${av>0?`<b class="f">${sh.toFixed(1)} months</b> <small>of expenses covered (goal 6)</small>${bar(sh/6*100,sh<3?'bad':'gr')}`:'<div class="mute">Add months and expenses to see how long your cash lasts.</div>'}</div>
 <h2>🏁 Opening savings</h2><div class="card">${S.opening.length?S.opening.map((x,i)=>`<div class="row"><div class="grow">${esc(x.n)}</div><div class="amt">${inr(x.a)}</div>${del('opening',i)}</div>`).join(''):'<div class="empty">Bank, cash, old investments before Jan.</div>'}<div class="row tot"><div class="grow">Total</div><div class="amt">${inr(sum(S.opening,x=>x.a))}</div></div></div>
 <form data-k="opening"><input name="n" placeholder="Source" required><input name="a" type="number" step="any" placeholder="Amount ₹" required><button class="btn">Add</button></form>
 <h2>🎨 Theme</h2><div style="display:flex;gap:12px">${[['noir','#e3b84a','Noir Gold'],['emerald','#3ddc97','Emerald'],['royal','#8b5cf6','Royal'],['crimson','#ff5a6a','Crimson']].map(t=>`<button data-act="theme" data-t="${t[0]}" class="sw${S.theme==t[0]?' on':''}" style="background:${t[1]}" aria-label="${t[2]}"></button>`).join('')}</div>
 <h2>💾 Backup</h2><div style="display:flex;gap:8px"><button class="btn ghost" data-act="export">Export</button><button class="btn ghost" data-act="import">Import</button><button class="btn ghost" data-act="csv">CSV</button></div>
 <p class="mute">Last backup: ${S.lastBackup||'never'}. Data stays only in this browser on this phone.</p><input type="file" id="file" accept="application/json" hidden>`}

function months(){
 var L=S.months.map((o,i)=>[o,i]).sort((a,b)=>b[0].k<a[0].k?-1:1),ts=sum(S.months,o=>o.salary||0),te=sum(S.months,o=>mExp(o.k)),ys=yearSaved();
 return `${chart()}<h2>📅 Salary & savings</h2>
 <form data-k="months" style="margin:0 0 4px"><input name="k" type="month" value="${today().slice(0,7)}" required><button class="btn">+ Add month</button></form>
 <div class="tiles" style="margin:12px 0"><div class="tile"><small>💼 Salary</small><b class="f">${inr(ts)}</b></div><div class="tile"><small>💸 Spent</small><b class="f">${inr(te)}</b></div><div class="tile"><small>💎 Saved</small><b class="f ${cls(ys)}">${inr(ys)}</b></div><div class="tile"><small>📊 Saving rate</small><b class="f">${ts?(ys/ts*100).toFixed(0):0}%</b></div></div>`
 +(L.length?L.map(([o,i])=>{var s=saved(o),pl=o.planned||0,sal=o.salary||0;
 return `<div class="card mc"><div class="h"><b>${mlabel(o.k)}</b><span class="amt p">💎 ${inr(s)}${del('months',i)}</span></div>
 <div class="g2"><label>💼 Salary (info only)<input data-sal="${i}" type="number" step="any" value="${sal||''}" placeholder="0"></label><label>🎯 Savings this month<input data-plan="${i}" type="number" step="any" value="${pl||''}" placeholder="0"></label></div>
 <small>💸 Total spent ${inr(mExp(o.k))}${sal?' · savings '+(pl/sal*100).toFixed(0)+'% of salary':''}</small></div>`}).join(''):'<div class="card pad mute">No months yet. Pick a month above and tap Add month.</div>')
 +'<p class="mute">Savings = the amount you set aside each month; salary and net worth do not use it. Expenses only show the total spent and never change your savings.</p>'}

function expForm(t){return `<h2 style="margin-top:0">${t}</h2><form data-k="exp" style="margin-top:0"><input name="d" type="date" value="${today()}" required><select name="c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input name="n" placeholder="What for?" required><input name="a" type="number" step="any" placeholder="Amount ₹" required><button class="btn">Add</button></form>`}

function spend(){
 var cur=today().slice(0,7),ex=S.exp.filter(e=>e.d.startsWith(cur)),mt=sum(ex,e=>e.a),bp=S.budget>0?mt/S.budget*100:0,
 cs=CATS.map(c=>[c,sum(ex.filter(e=>(e.c||CATS[7])==c),e=>e.a)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),mx=cs.length?cs[0][1]:1,
 list=S.exp.map((e,i)=>[e,i]).sort((a,b)=>b[0].d<a[0].d?-1:b[0].d>a[0].d?1:b[1]-a[1]);
 return expForm('💸 Add expense')
 +`<h2>⚔️ Month budget</h2><div class="card pad"><div style="display:flex;justify-content:space-between"><span>Spent ${inr(mt)}</span><b>${S.budget?inr(S.budget):''}</b></div>${S.budget>0?bar(bp,bp>100?'bad':bp>80?'pk':'gr'):''}${bp>100?`<small class="n">⚠️ Over budget by ${inr(mt-S.budget)}</small>`:S.budget>0?`<small>${inr(S.budget-mt)} left</small>`:''}
 <input id="bud" type="number" step="any" value="${S.budget||''}" placeholder="Set monthly limit ₹" style="width:100%;margin-top:8px"></div>
 <h2>🧾 Where it went (this month)</h2><div class="card pad">${cs.length?cs.map(x=>`<div class="cat"><span>${x[0]}</span>${bar(x[1]/mx*100,'pk')}<span>${inr(x[1])}</span></div>`).join(''):'<div class="mute">No expenses this month yet.</div>'}</div>
 <h2>🔁 Recurring expenses</h2><div class="card">${S.rec.length?S.rec.map((r,i)=>`<div class="row"><div class="grow">${esc(r.n)}<small>${esc(r.c)} · every month, day ${r.day}</small></div><div class="amt">${inr(r.a)}</div>${del('rec',i)}</div>`).join(''):'<div class="empty">Rent, EMI, subscriptions: add once, auto every month.</div>'}</div>
 <form data-k="rec"><input name="n" placeholder="Name (Rent, EMI…)" required><select name="c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input name="a" type="number" step="any" placeholder="Amount ₹" required><input name="day" type="number" min="1" max="31" placeholder="Day of month"><button class="btn">Add</button></form>
 <h2>📜 History</h2><div class="card">${list.length?list.map(o=>`<div class="row"><div class="grow">${esc(o[0].n)}<small>${esc(o[0].c||CATS[7])} · ${esc(o[0].d)}</small></div><div class="amt">${inr(o[0].a)}</div>${del('exp',o[1])}</div>`).join(''):'<div class="empty">No expenses yet.</div>'}</div>`}

function fdBlock(){var L=S.fds.map((f,i)=>[f,i]).sort((a,b)=>a[0].m<b[0].m?-1:1),pr=sum(S.fds,f=>f.a),ev=sum(S.fds,fdEnd),T=Date.now();
 return `<h2>🔒 Fixed deposits</h2><div class="card">${L.length?L.map(([f,i])=>{var dl=Math.ceil((new Date(f.m)-T)/864e5);
 return `<div class="row"><div class="grow">${esc(f.n)}<small>${inr(f.a)}${f.r?' @ '+f.r+'%':''} · matures ${esc(f.m)}</small><small class="${dl<=0?'p':dl<=30?'n':''}">${dl<=0?'✅ Matured':dl<=30?'⏳ '+dl+' days left':dl+' days left'}</small></div><div class="r"><div class="amt">${inr(fdEnd(f))}</div><small>at maturity</small></div>${del('fds',i)}</div>`}).join(''):'<div class="empty">No FDs yet.</div>'}
 <div class="row tot"><div class="grow">${S.fds.length} FD${S.fds.length==1?'':'s'}<small>Invested ${inr(pr)}</small></div><div class="r"><div class="amt">${inr(ev)}</div><small>at maturity</small></div></div></div>
 <form data-k="fds"><input name="n" placeholder="Bank / name" required><input name="a" type="number" step="any" placeholder="Amount ₹" required><input name="r" type="number" step="any" placeholder="Rate % (optional)"><label class="lb">Start date (optional)<input name="s" type="date"></label><label class="lb">Maturity date<input name="m" type="date" required></label><button class="btn">Add FD</button></form>
 <p class="mute" style="margin:6px 0 0">Add rate and start date to see the maturity amount (quarterly compounding).</p>`}

function hold(k,t){var a=S[k],i=sum(a,x=>x.i),c=sum(a,x=>x.c);
 return `<h2>${t}</h2><div class="card">${a.length?a.map((x,j)=>`<div class="row"><div class="grow">${esc(x.n)}<small>Invested ${inr(x.i)}</small><small class="${cls(x.c-x.i)}">${pn(x.c-x.i,x.i)}</small></div><input class="cv" data-cv="${k},${j}" type="number" step="any" value="${x.c}" aria-label="Current value">${del(k,j)}</div>`).join(''):'<div class="empty">Nothing here yet.</div>'}
 <div class="row tot"><div class="grow">Total<small>Invested ${inr(i)}</small></div><div class="r"><div class="amt">${inr(c)}</div><small class="${cls(c-i)}">${pn(c-i,i)}</small></div></div></div>
 <form data-k="${k}"><input name="n" placeholder="Name" required><input name="i" type="number" step="any" placeholder="Invested ₹" required><input name="c" type="number" step="any" placeholder="Current ₹ (optional)"><button class="btn">Add</button></form>
 <p class="mute" style="margin:6px 0 0">Type in the box on any row to update its current value.</p>`}

function invest(){
 var g=sum(S.gold,x=>x.g),ga=sum(S.gold,x=>x.g*x.r),gv=goldVal();
 return `<h2>🔁 SIP tracker</h2><div class="card">${S.sip.length?S.sip.map((x,i)=>`<div class="row"><div class="grow">${esc(x.n)}</div><div class="amt">${inr(x.a)}</div>${del('sip',i)}</div>`).join(''):'<div class="empty">No SIPs yet.</div>'}<div class="row tot"><div class="grow">Per month</div><div class="amt">${inr(sum(S.sip,x=>x.a))}</div></div></div>
 <form data-k="sip"><input name="n" placeholder="Fund name" required><input name="a" type="number" step="any" placeholder="Monthly ₹" required><button class="btn">Add SIP</button></form>`
 +insBlock()+fdBlock()+hold('mf','📈 Mutual funds')+hold('st','📊 Stocks')+debtBlock()
 +goldBlock()}

function goldBlock(){var T0=today(),base=sum(S.gold,x=>x.g*x.r),gst=sum(S.gold,x=>x.g*x.r*(x.gst||0)/100),g=sum(S.gold,x=>x.g),cost=base+gst,gv=goldVal();
 return `<h2>🪙 Gold ledger</h2><div class="card">${S.gold.length?S.gold.map((x,i)=>{var b=x.g*x.r,t=b*(x.gst||0)/100;return `<div class="row"><div class="grow">${x.g} gm @ ${inr(x.r)}<small>${esc(x.d)} · Base ${inr(b)} + GST ${x.gst||0}% ${inr(t)}</small></div><div class="amt">${inr(b+t)}</div>${del('gold',i)}</div>`}).join(''):'<div class="empty">No gold bought yet.</div>'}
 <div class="row tot"><div class="grow">${+g.toFixed(3)} gm<small>Cost incl. GST ${inr(cost)} · GST ${inr(gst)}</small></div><div class="r"><div class="amt">${inr(gv)}</div><small class="${cls(gv-cost)}">${pn(gv-cost,cost)}</small></div></div></div>
 <form data-k="gold"><input name="d" type="date" value="${T0}" required><input name="g" type="number" step="any" placeholder="Gold (gm)" required><input name="r" type="number" step="any" placeholder="Rate ₹/gm" required><input name="gst" type="number" step="any" value="3" placeholder="GST %"><button class="btn">Add</button></form>
 <div class="card pad" style="margin-top:8px"><div style="display:flex;justify-content:space-between;align-items:center"><span>🪙 Today's 24K rate per gm</span><b class="f">${S.goldRate?inr(S.goldRate):'—'}</b></div>
 <input id="grate" type="number" step="any" value="${S.goldRate||''}" placeholder="Enter today's rate ₹/gm" style="width:100%;margin-top:8px"><small>Type today's rate and the gold value above updates.</small></div>`}

function addYear(d){var x=new Date(d+'T00:00:00');x.setFullYear(x.getFullYear()+1);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
var FQ={yearly:['Yearly',12],half:['Half-yearly',6],quarterly:['Quarterly',3],monthly:['Monthly',1]};
function addMo(d,m){var x=new Date(d+'T00:00:00');x.setMonth(x.getMonth()+m);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function insBlock(){
 var T0=today(),L=S.ins.map((p,i)=>[p,i]),paidYr=sum(S.ins,p=>sum(p.pay.filter(x=>x.d.startsWith(Y)),x=>x.a));
 return `<h2>🛡️ Insurance (LIC)</h2>`
 +(L.length?L.map(([p,i])=>{
   var fk=p.f||'yearly',f=FQ[fk],last=p.pay.map(x=>x.d).sort().pop(),due=last?addMo(last,f[1]):T0,
   dd=Math.round((new Date(due+'T00:00:00')-new Date(T0+'T00:00:00'))/864e5),
   st=dd<0?`<small class="n">⚠️ Overdue by ${-dd} day${-dd==1?'':'s'}</small>`:dd<=30?`<small style="color:var(--go)">⏳ Due in ${dd} day${dd==1?'':'s'} · ${due}</small>`:`<small class="p">✅ Next due ${due}</small>`,
   paid=sum(p.pay.filter(x=>x.d.startsWith(Y)),x=>x.a),
   hist=p.pay.map((x,j)=>[x,j]).sort((a,b)=>a[0].d<b[0].d?1:-1).slice(0,8);
   return `<div class="card pad" style="margin-bottom:10px">
   <div class="hr"><div class="grow"><b class="f" style="font-size:16px">${esc(p.n)}</b><small style="display:block">${inr(p.p)} ${f[0].toLowerCase()} · ≈ ${inr(p.p*12/f[1])}/yr${p.sa?' · Sum assured '+inr(p.sa):''}${p.m?' · Matures '+esc(p.m):''}</small></div>
   <select data-fq="${i}" style="flex:none;width:auto;padding:6px 8px;font-size:14px">${Object.keys(FQ).map(k=>`<option value="${k}"${fk==k?' selected':''}>${FQ[k][0]}</option>`).join('')}</select>${del('ins',i)}</div>
   <div style="margin-top:6px">${st}</div>
   <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px"><small>Paid ${Y}: <b class="p">${inr(paid)}</b> · Total ${inr(sum(p.pay,x=>x.a))}</small><button class="btn" data-act="paynow" data-i="${i}">✅ Paid today</button></div>
   <form data-k="inspay" style="margin-top:8px"><input type="hidden" name="i" value="${i}"><input name="d" type="date" value="${T0}" required><input name="a" type="number" step="any" value="${p.p}" required><button class="btn">Add payment</button></form>
   ${hist.length?`<div style="margin-top:8px">${hist.map(([x,j])=>`<div class="row" style="padding:6px 0"><div class="grow"><small>${esc(x.d)}</small></div><div class="amt">${inr(x.a)}</div><button class="x" data-act="delpay" data-i="${i}" data-j="${j}" aria-label="Remove payment">×</button></div>`).join('')}</div>`:''}
   </div>`}).join(''):'<div class="card pad empty">No policy added yet.</div>')
 +`<div class="tiles" style="margin:10px 0 0"><div class="tile"><small>📆 Premium paid ${Y}</small><b class="f">${inr(paidYr)}</b></div></div>`
 +`<form data-k="ins"><input name="n" placeholder="Policy name (e.g. Jeevan Lakshya)" required><input name="p" type="number" step="any" placeholder="Premium per payment ₹" required><select name="f">${Object.keys(FQ).map(k=>`<option value="${k}">${FQ[k][0]}</option>`).join('')}</select><input name="sa" type="number" step="any" placeholder="Sum assured ₹ (optional)"><label class="lb">Maturity date (optional)<input name="m" type="date"></label><button class="btn">Add policy</button></form>
 <p class="mute" style="margin:6px 0 0">Add payments by hand with their date, or tap "Paid today". Next due is counted from the last payment using the frequency. Premiums do not change your savings.</p>`;
}

var T=[['home','🏠','Base'],['months','📅','Months'],['spend','💸','Spend'],['invest','📈','Invest']];
function header(){return `<div class="top"><div class="tl"><div>🎮 LOOT <span>VAULT</span></div><button class="qa" data-act="fab" aria-label="Quick add expense">＋</button></div>
 <div class="status">${OK?'<i style="color:var(--gr)">●</i> Saved on this phone':'<i class="n">●</i> Not saving'} · ${new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</div>
 <div class="tabs">${T.map(t=>`<button data-act="tab" data-t="${t[0]}"${tab==t[0]?' class="on"':''}><span>${t[1]}</span>${t[2]}</button>`).join('')}</div></div>`}
function render(){
 document.documentElement.dataset.t=S.theme||'noir';
 document.getElementById('app').innerHTML=header()+({home,months,spend,invest})[tab]();
}
function go(t){tab=t;render();var A=document.getElementById('app');A.classList.remove('in');void A.offsetWidth;A.classList.add('in');scrollTo(0,0)}
function sheet(o){var s=document.getElementById('sheet');if(o)s.firstElementChild.innerHTML=expForm('⚡ Quick add expense');s.classList.toggle('open',!!o)}

document.addEventListener('submit',ev=>{var f=ev.target,k=f.dataset.k;if(!k)return;ev.preventDefault();var v=Object.fromEntries(new FormData(f));
 if(k=='opening'||k=='sip')S[k].push({n:v.n.trim(),a:+v.a});
 if(k=='exp')S.exp.push({d:v.d,c:v.c,n:v.n.trim(),a:+v.a});
 if(k=='gold')S.gold.push({d:v.d,g:+v.g,r:+v.r,gst:+v.gst||0});
 if(k=='mf'||k=='st')S[k].push({n:v.n.trim(),i:+v.i,c:v.c===''||v.c==null?+v.i:+v.c});
 if(k=='months'&&!S.months.some(o=>o.k==v.k)){var prev=[...S.months].sort((a,b)=>a.k<b.k?1:-1)[0];S.months.push({k:v.k,salary:prev?prev.salary:0,planned:prev?prev.planned:0})}
 if(k=='rec'){S.rec.push({n:v.n.trim(),c:v.c,a:+v.a,day:+v.day||1,last:''});applyRec()}
 if(k=='debts')S.debts.push({n:v.n.trim(),a:+v.a,p:0,dir:v.dir});
 if(k=='fds')S.fds.push({n:v.n.trim(),a:+v.a,r:+v.r||0,s:v.s,m:v.m});
 if(k=='ins')S.ins.push({n:v.n.trim(),p:+v.p,f:v.f||'yearly',sa:+v.sa||0,m:v.m||'',pay:[]});
 if(k=='inspay')S.ins[+v.i].pay.push({d:v.d,a:+v.a});
 if(k=='goals')S.goals.push({n:v.n.trim(),t:+v.t||1,s:0});
 save();sheet(false);render()});

document.addEventListener('change',ev=>{var t=ev.target,d=t.dataset,v=+t.value||0;
 if(d.fq!==undefined)S.ins[+d.fq].f=t.value;
 else if(d.sal!==undefined)S.months[+d.sal].salary=v;
 else if(d.plan!==undefined)S.months[+d.plan].planned=v;
 else if(d.cv){var p=d.cv.split(',');S[p[0]][+p[1]].c=v}
 else if(d.gs!==undefined)S.goals[+d.gs].s=v;
 else if(t.id=='target')S.target=v;
 else if(t.id=='bud')S.budget=v;
 else if(d.dp!==undefined)S.debts[+d.dp].p=v;
 else if(t.id=='grate')S.goldRate=v;
 else if(t.id=='file'&&t.files[0]){var r=new FileReader();r.onload=()=>{try{var x=JSON.parse(r.result);if(!x||!Array.isArray(x.exp))throw 0;S=migrate(x);save();render();alert('Backup restored ✅')}catch(e){alert('Not a valid backup file.')}};r.readAsText(t.files[0]);return}
 else return;
 save();render()});

document.addEventListener('click',ev=>{if(ev.target.id=='sheet')return sheet(false);var b=ev.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
 if(a=='tab')go(b.dataset.t);
 if(a=='fab')sheet(true);
 if(a=='theme'){S.theme=b.dataset.t;save();render()}
 if(a=='del'&&confirm('Delete this entry?')){S[b.dataset.k].splice(+b.dataset.i,1);save();render()}
 if(a=='export'){S.lastBackup=today();save();var u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='loot-vault-backup-'+today()+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);render()}
 if(a=='paynow'){var p=S.ins[+b.dataset.i];if(p.pay.some(x=>x.d==today())&&!confirm('Aaj ka premium pehle hi daal chuka hai. Phir se add karu?'))return;p.pay.push({d:today(),a:p.p});save();render()}
 if(a=='delpay'&&confirm('Ye payment entry hatau?')){S.ins[+b.dataset.i].pay.splice(+b.dataset.j,1);save();render()}
 if(a=='import')document.getElementById('file').click();
 if(a=='csv')downloadCSV()});

var tx,ty;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty,L=T.map(t=>t[0]),j=L.indexOf(tab)+(dx<0?1:-1);
 if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||Math.abs(dx)<80||Math.abs(dy)>60||document.getElementById('sheet').classList.contains('open'))return;if(L[j])go(L[j])},{passive:true});
applyRec();render();
</script></body></html>
