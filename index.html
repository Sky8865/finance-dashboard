<style>

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0));width:min(94%,430px);display:flex;gap:6px;padding:7px;background:color-mix(in srgb,var(--card2) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 44px #000d,0 0 0 1px #ffffff0a;z-index:6}

.mt.p{color:var(--gr)}.mt.n{color:var(--rd)}

#dots{display:flex;gap:14px;margin-bottom:22px}#dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--a1)}#dots span.f{background:var(--a1)}
.kp{display:grid;grid-template-columns:repeat(3,76px);gap:14px}

.kp button:active{background:var(--gl)}.kp i{display:block}

.srch{width:100%;margin:0 0 10px}

<body><main id="app"></main><div id="sheet"><div></div></div><div id="toast"></div><nav class="dock" id="dock"></nav>
<div id="lock"><div class="lk-t">🔐 Loot Vault</div><div class="lk-s">Enter your PIN</div><div id="dots"><span></span><span></span><span></span><span></span></div><div class="kp"><button data-act="pk" data-d="1">1</button><button data-act="pk" data-d="2">2</button><button data-act="pk" data-d="3">3</button><button data-act="pk" data-d="4">4</button><button data-act="pk" data-d="5">5</button><button data-act="pk" data-d="6">6</button><button data-act="pk" data-d="7">7</button><button data-act="pk" data-d="8">8</button><button data-act="pk" data-d="9">9</button><i></i><button data-act="pk" data-d="0">0</button><button data-act="pk" data-d="b" aria-label="Backspace">⌫</button></div></div>
<script>
var ICO_EDIT='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
ICO_DEL='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>';
var KEY='paisa-tracker-v1',Y=new Date().getFullYear(),MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
CATS=[['Food','🍔'],['Groceries','🛒'],['Bills','💡'],['Rent','🏠'],['Travel','✈️'],['Fuel','⛽'],['Shopping','🛍️'],['Fun & Games','🎮'],['Splitwise','🧾'],['Credit card bill','💳'],['Health','💊'],['EMI','🏦'],['Other','📦']],
FIXED=['Rent','Splitwise','Credit card bill'],
FQ={yearly:['Yearly',12],half:['Half-yearly',6],quarterly:['Quarterly',3],monthly:['Monthly',1]},
THEMES=[['noir','#f2c14e','Gold'],['ocean','#48cfff','Ocean'],['crimson','#ff5a6a','Crimson'],['sunset','#ff9e4a','Sunset'],['rose','#ff6fa3','Rose'],['slate','#c9d6e3','Slate']],
tab='home',sub='mf',selM=null,achSel=-1;

var blank=()=>({opening:[],months:[],closed:[],exp:[],rec:[],sip:[],mf:[],st:[],gold:[],fds:[],ins:[],goals:[],debts:[],target:0,reserve:100000,goalName:'Main goal',goldRate:0,goldGst:3,theme:'noir',lastBackup:''});
function migrate(d){var s=Object.assign(blank(),d);if(!d.months&&Array.isArray(d.salary))s.months=d.salary.map((v,m)=>({k:Y+'-'+String(m+1).padStart(2,'0'),salary:v||0,planned:(d.planned||[])[m]||0,budget:0})).filter(x=>x.salary||x.planned);s.closed=s.closed||[];return s}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&typeof d=='object')return migrate(d)}catch(e){}return blank()}
var S=load(),OK=true;
try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){OK=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){OK=false}}
try{navigator.storage.persist()}catch(e){}

var inr=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0),

cls=n=>n<0?'n':'p',
pct=(d,b)=>b?(d/b*100).toFixed(1):'0.0',
bar=(p,c)=>`<div class="bar ${c||''}"><i style="width:${clamp(p)}%"></i></div>`,
del=(k,i)=>`<button class="ico" data-act="edit" data-k="${k}" data-i="${i}" aria-label="Edit">${ICO_EDIT}</button><button class="ico d" data-act="del" data-k="${k}" data-i="${i}" aria-label="Delete">${ICO_DEL}</button>`,
today=()=>{var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
CUR=()=>today().slice(0,7),
fmtD=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'',
mlabel=k=>MO[+k.slice(5)-1]+' '+k.slice(0,4),
addMK=(k,n)=>{var d=new Date(+k.slice(0,4),+k.slice(5,7)-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')},
toast=(m,u)=>{if(navigator.vibrate)navigator.vibrate(12);var t=document.getElementById('toast');t.innerHTML='<span></span>'+(u?'<button data-act="undo">Undo</button>':'');t.firstChild.textContent=m;toast.u=u||null;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>{t.classList.remove('on');toast.u=null},u?5000:2100)};
function cname(c){if(!c)return'Other';var f=CATS.find(x=>c.endsWith(x[0]));if(f)return f[0];c=c.replace(/^\S+\s/,'');return c=='Fun'?'Fun & Games':c}
function cicon(n){var f=CATS.find(x=>x[0]==n);return f?f[1]:'📦'}

/* ---------- money ---------- */
function monthKeys(){return S.months.map(o=>o.k).sort()}
function allKeys(){var s={};S.months.forEach(o=>s[o.k]=1);S.exp.forEach(e=>s[e.d.slice(0,7)]=1);s[CUR()]=1;return Object.keys(s).sort()}
function getM(k){return S.months.find(o=>o.k==k)||{k:k,salary:0,planned:0,budget:0,mexp:0}}
function ensureM(k){var o=S.months.find(x=>x.k==k);if(!o){o={k:k,salary:0,planned:0,budget:0,mexp:0};S.months.push(o)}return o}
function isClosed(k){return S.closed.indexOf(k)>-1}
function mExp(k){return sum(S.exp.filter(e=>e.d.slice(0,7)==k),e=>e.a)}
function mOut(k){return getM(k).mexp||0}
function actual(k){return (getM(k).planned||0)-mOut(k)}
function goldVal(){var g=sum(S.gold,x=>x.g),incl=(S.goldRate||0)*(1+(S.goldGst==null?3:S.goldGst)/100);return incl>0?g*incl:sum(S.gold,x=>x.g*x.r*(1+(x.gst||0)/100))}
function fdVal(f,at){if(!f.r||!f.s)return f.a;var t=Math.max(0,(new Date(at)-new Date(f.s))/315576e5);return f.a*Math.pow(1+f.r/400,4*t)}
var fdNow=f=>fdVal(f,Math.min(Date.now(),new Date(f.m))),fdEnd=f=>fdVal(f,f.m);
function addMo(d,m){var x=new Date(d+'T00:00:00');x.setMonth(x.getMonth()+m);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function applyRec(){var ym=CUR(),ch=false;S.rec.forEach(r=>{if(r.last!==ym){var dd=Math.min(Math.max(+r.day||1,1),28);S.exp.push({d:ym+'-'+String(dd).padStart(2,'0'),c:r.c,n:r.n,a:r.a,auto:1});r.last=ym;ch=true}});if(ch)save()}
function stats(){
 var open=sum(S.opening,x=>x.a),sav=sum(monthKeys().filter(k=>k<=CUR()),actual),cash=open+sav,
 mc=sum(S.mf,x=>x.c),sc=sum(S.st,x=>x.c),gv=goldVal(),fv=sum(S.fds,fdNow),sip=sum(S.sip,x=>x.a),
 nw=cash+mc+sc+gv+fv,lv=Math.floor(Math.max(nw,0)/1e5)+1,
 sk=allKeys().filter(k=>mExp(k)>0),avg=sk.length?sum(sk,mExp)/sk.length:0,cover=avg>0?cash/avg:0,
 res=S.reserve==null?100000:S.reserve,goal=Math.max(cash-res,0),
 parts=[['Cash',cash,'#56c2ff'],['Funds',mc,'#ff7aa8'],['Stocks',sc,'#ff8a3d'],['Gold',gv,'#ffd23f'],['FDs',fv,'#4f7cff']];
 return {open:open,sav:sav,cash:cash,mc:mc,sc:sc,gv:gv,fv:fv,sip:sip,nw:nw,lv:lv,avg:avg,cover:cover,res:res,goal:goal,parts:parts,
  avgKnown:sk.length>0}
}

/* ---------- achievements ---------- */
function achievements(){var s=stats(),mk=monthKeys();
 return [
  {e:'🌱',n:'First step',d:'Add your first month.',ok:S.months.length>0},
  {e:'💰',n:'Lakh club',d:'Reach a net worth of ₹1,00,000.',ok:s.nw>=1e5},
  {e:'💎',n:'Five lakh',d:'Reach a net worth of ₹5,00,000.',ok:s.nw>=5e5},
  {e:'🛡️',n:'Shield up',d:'Cover 3 months of average spending.',ok:s.cover>=3},
  {e:'🏰',n:'Fortress',d:'Cover 6 months of average spending.',ok:s.cover>=6},
  {e:'🎯',n:'Budget boss',d:'Finish a month within its budget.',ok:allKeys().some(k=>{var b=getM(k).budget;return b>0&&mExp(k)>0&&mExp(k)<=b})},
  {e:'📈',n:'Saver',d:'Save 20% or more of salary in one month.',ok:mk.some(k=>{var o=getM(k);return o.salary>0&&actual(k)/o.salary>=.2})},
  {e:'🧩',n:'Diversified',d:'Hold 4 or more kinds of assets.',ok:s.parts.filter(p=>p[1]>0).length>=4},
  {e:'🪙',n:'Gold hoarder',d:'Own 10 grams or more of gold.',ok:sum(S.gold,x=>x.g)>=10},
  {e:'🛡',n:'Insured',d:'Add an insurance policy.',ok:S.ins.length>0},
  {e:'🤝',n:'Debt free',d:'Settle every debt you owe.',ok:S.debts.some(d=>d.dir=='owe')&&S.debts.filter(d=>d.dir=='owe').every(d=>d.a-(d.p||0)<=0)},
  {e:'🏆',n:'Level 5',d:'Reach level 5.',ok:s.lv>=5}
 ]}

/* ---------- edit ---------- */
var SCH={
 exp:[['d','date','Date'],['c','cat','Category'],['n','text','Note'],['a','num','Amount ₹']],
 opening:[['n','text','Source'],['a','num','Amount ₹']],
 sip:[['n','text','Fund name'],['a','num','Monthly ₹']],
 mf:[['n','text','Fund name'],['i','num','Invested ₹'],['c','num','Current value ₹']],
 st:[['n','text','Stock name'],['i','num','Invested ₹'],['c','num','Current value ₹']],
 gold:[['d','date','Date'],['g','num','Grams'],['r','num','Rate ₹/gm'],['gst','num','GST %']],
 fds:[['n','text','Bank'],['a','num','Amount ₹'],['r','num','Rate %'],['s','date','Start date'],['m','date','Maturity date']],
 goals:[['n','text','Goal'],['t','num','Target ₹']],
 ins:[['n','text','Policy name'],['p','num','Premium per payment ₹'],['f','freq','Frequency'],['sa','num','Sum assured ₹'],['m','date','Maturity date']],
 rec:[['n','text','Name'],['c','cat','Category'],['a','num','Amount ₹'],['day','num','Day of month']],
 debts:[['n','text','Name'],['dir','dir','Direction'],['a','num','Amount ₹']],
 pay:[['d','date','Date'],['a','num','Amount ₹']]
};
function fld(n,t,l,v){var val=v==null?'':v;
 if(t=='cat')return `<label class="lb">${l}<select name="${n}">${CATS.map(c=>`<option value="${c[0]}"${c[0]==cname(val)?' selected':''}>${c[1]} ${c[0]}</option>`).join('')}</select></label>`;
 if(t=='freq')return `<label class="lb">${l}<select name="${n}">${Object.keys(FQ).map(k=>`<option value="${k}"${k==(val||'yearly')?' selected':''}>${FQ[k][0]}</option>`).join('')}</select></label>`;
 if(t=='dir')return `<label class="lb">${l}<select name="${n}"><option value="owe"${val=='owe'?' selected':''}>I owe</option><option value="due"${val=='due'?' selected':''}>Owed to me</option></select></label>`;
 if(t=='date')return `<label class="lb">${l}<input name="${n}" type="date" value="${esc(val)}"></label>`;
 if(t=='num')return `<label class="lb">${l}<input name="${n}" type="number" inputmode="decimal" step="any" value="${esc(val)}"></label>`;
 return `<label class="lb">${l}<input name="${n}" type="text" value="${esc(val)}"></label>`}
function openEdit(k,i,j){var hasJ=j!==undefined&&j!==null&&j!=='';var sc=hasJ?SCH.pay:SCH[k];
 var o=hasJ?S[k][+i].pay[+j]:S[k][+i];if(!sc||!o)return;
 var s=document.getElementById('sheet');
 s.firstElementChild.innerHTML=`<h2>Edit</h2><form data-k="edit" style="margin-top:0"><input type="hidden" name="_k" value="${k}"><input type="hidden" name="_i" value="${i}"><input type="hidden" name="_j" value="${hasJ?j:''}"><div class="fields" style="margin-top:0;width:100%">${sc.map(f=>fld(f[0],f[1],f[2],o[f[0]])).join('')}</div><div style="width:100%;display:flex;gap:8px;margin-top:12px"><button class="btn" style="flex:1">Save</button><button type="button" class="btn ghost" data-act="closesheet">Cancel</button></div></form>`;
 s.classList.add('open')}
function applyEdit(v){var k=v._k,i=v._i,j=v._j,hasJ=j!=='',sc=hasJ?SCH.pay:SCH[k];
 var tgt=hasJ?S[k][+i].pay[+j]:S[k][+i];
 if(k=='exp'&&(isClosed(tgt.d.slice(0,7))||isClosed(v.d.slice(0,7)))){toast('This month is closed');return false}
 sc.forEach(f=>{if(!(f[0] in v))return;var x=v[f[0]];tgt[f[0]]=f[1]=='num'?(+x||0):(f[1]=='text'?String(x).trim():x)});
 return true}

/* ---------- forms ---------- */
function catOpts(sel){return CATS.map(c=>`<option value="${c[0]}"${sel==c[0]?' selected':''}>${c[1]} ${c[0]}</option>`).join('')}
function qChips(){var cnt={};S.exp.forEach(e=>{if(e.auto||!e.n)return;var k=e.n.trim();cnt[k]=(cnt[k]||0)+1});var notes=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,5);
 return `<div class="qchips">${[100,200,500,1000].map(v=>`<button type="button" data-act="amt" data-v="${v}">₹${v}</button>`).join('')}${notes.map(n=>`<button type="button" data-act="note" data-v="${esc(n)}">${esc(n)}</button>`).join('')}</div>`}
function expForm(d){return `${qChips()}<form data-k="exp" style="margin-top:0"><input name="d" type="date" value="${d||today()}" required><select name="c">${catOpts('Food')}</select><input name="n" placeholder="Note (optional)"><input name="a" type="number" inputmode="decimal" step="any" placeholder="Amount ₹" required><button class="btn">Add expense</button></form>`}

/* ---------- Home ---------- */
function emptyBox(i,t,s){return `<div class="empty2"><span>${i}</span><b>${t}</b><small>${s}</small></div>`}
function onb(){if(localStorage.getItem('lv-onb')||S.months.length||S.exp.length||S.opening.length)return '';
 return `<div class="card onb"><div class="lbl" style="color:var(--a1)">Get started</div><div class="onbl" style="margin-top:8px"><div><b>1</b>Add your opening savings below</div><div><b>2</b>Set salary and planned savings in Months</div><div><b>3</b>Tap + to log every expense</div></div><button class="btn" data-act="onbdone" style="margin-top:12px">Got it</button></div>`}
function home(){
 var s=stats(),p=clamp(s.goal/(S.target||1)*100),xp=Math.max(s.nw,0)%1e5/1e3,tt=sum(s.parts,q=>Math.max(q[1],0))||1,
 A=achievements(),won=A.filter(a=>a.ok).length;
 var nag=(S.exp.length+S.months.length)>=5&&(!S.lastBackup||(Date.now()-new Date(S.lastBackup))/864e5>14);
 return `<div class="fade">
 
 ${onb()}<section class="hero">
  <div class="hr"><div><div class="lbl">Net worth</div><div class="big" data-count="${Math.round(s.nw)}">${inr(s.nw)}</div></div><div class="ring" style="--p:${xp*3.6}deg"><b>${s.lv}</b><small>Level</small></div></div>
  <div class="stack">${s.parts.map(q=>q[1]>0?`<i style="width:${q[1]/tt*100}%;background:${q[2]}"></i>`:'').join('')}</div>
  <div class="leg">${s.parts.map(q=>`<span><u style="background:${q[2]}"></u>${q[0]}</span>`).join('')}</div>
 </section>
 <div class="grid">
  <div class="tile"><div class="tlbl"><span class="tic">🏦</span>Cash</div><b>${inr(s.cash)}</b></div>
  <div class="tile"><div class="tlbl"><span class="tic">📈</span>Funds</div><b>${inr(s.mc)}</b></div>
  <div class="tile"><div class="tlbl"><span class="tic">📊</span>Stocks</div><b>${inr(s.sc)}</b></div>
  <div class="tile"><div class="tlbl"><span class="tic">🪙</span>Gold</div><b>${inr(s.gv)}</b></div>
  <div class="tile"><div class="tlbl"><span class="tic">🔒</span>Fixed deposits</div><b>${inr(s.fv)}</b></div>
  <div class="tile"><div class="tlbl"><span class="tic">🔁</span>SIP / month</div><b>${inr(s.sip)}</b></div>
 </div>

 <div class="sec"><span>${esc(S.goalName||'Main goal')}</span></div>
 <div class="card">
  <div class="hr"><div><div class="lbl">Saved toward target</div><div class="f" style="font-size:22px;margin-top:4px">${inr(s.goal)} <small>of ${inr(S.target)}</small></div></div><div class="f" style="font-size:20px;color:var(--a1)">${p.toFixed(0)}%</div></div>
  ${bar(p,'warn')}
  <div class="resline"><small>Reserve</small><b class="${s.cash>=s.res?'p':'n'}">${inr(s.res)}</b><span class="pill ${s.cash>=s.res?'g':'r'}">${s.cash>=s.res?'Covered':'Not covered yet'}</span></div>
  <div class="fields">
   <input id="gname" type="text" value="${esc(S.goalName||'')}" placeholder="Goal name">
   <input id="target" type="number" inputmode="decimal" step="any" value="${S.target||''}" placeholder="Target ₹">
   <input id="reserve" type="number" inputmode="decimal" step="any" value="${s.res}" placeholder="Reserve ₹">
  </div>
 </div>
 ${S.goals.map((g,i)=>`<div class="card" style="margin-top:10px"><div class="hr"><div class="grow"><b>${esc(g.n)}</b><small style="display:block">${inr(g.s)} of ${inr(g.t)}</small></div><span class="pill">${clamp(g.s/g.t*100).toFixed(0)}%</span>${del('goals',i)}</div>${bar(g.s/g.t*100,'good')}<div style="display:flex;gap:8px;align-items:center"><small>Saved so far</small><input class="cv" data-gs="${i}" type="number" inputmode="decimal" step="any" value="${g.s}"></div></div>`).join('')}
 <form data-k="goals"><input name="n" placeholder="New goal" required><input name="t" type="number" inputmode="decimal" step="any" placeholder="Target ₹" required><button class="btn">Add</button></form>

 <div class="sec"><span>Safety cover</span></div>
 <div class="card">
  <div class="hr"><div><div class="lbl">Months covered</div><div class="f" style="font-size:22px;margin-top:4px">${s.avgKnown?s.cover.toFixed(1):'—'}</div></div><small>goal 6</small></div>
  ${bar(s.cover/6*100,s.cover<3?'bad':'good')}
  <small>How many months your cash lasts at your average monthly spend (${s.avgKnown?inr(s.avg):'add expenses to see'}).</small>
 </div>

 <div class="sec"><span>Achievements</span><span>${won} / ${A.length}</span></div>
 <div class="ach">${A.map((a,i)=>`<button class="${a.ok?'on':''} ${achSel==i?'sel':''}" data-act="ach" data-i="${i}"><span class="e">${a.e}</span>${a.n}</button>`).join('')}</div>
 ${achSel>-1?`<div class="card achd"><b>${A[achSel].e} ${A[achSel].n}</b><small style="display:block;margin-top:4px">${A[achSel].d}</small><span class="pill ${A[achSel].ok?'g':''}" style="margin-top:8px;display:inline-block">${A[achSel].ok?'Unlocked':'Locked'}</span></div>`:'<small style="display:block;margin-top:10px">Tap a badge to see how to unlock it.</small>'}

 <div class="sec"><span>Opening savings</span><span>${inr(s.open)}</span></div>
 <div class="card">${S.opening.length?S.opening.map((x,i)=>`<div class="row"><div class="grow">${esc(x.n)}</div><div class="amt">${inr(x.a)}</div>${del('opening',i)}</div>`).join(''):'<div class="empty">Bank balance, cash or old investments before January.</div>'}</div>
 <form data-k="opening"><input name="n" placeholder="Source" required><input name="a" type="number" inputmode="decimal" step="any" placeholder="Amount ₹" required><button class="btn">Add</button></form>

 <div class="sec"><span>Settings</span></div>
 <div class="card">

  <div class="lbl" style="margin:16px 0 10px">App lock</div><div class="sets">${localStorage.getItem(PIN_KEY)?'<button class="btn ghost" data-act="pinset">Change PIN</button><button class="btn ghost" data-act="pinrm">Remove PIN</button>':'<button class="btn ghost" data-act="pinset">Set PIN</button>'}</div>
  <div class="lbl" style="margin:16px 0 10px">Backup</div>

  <small style="display:block;margin-top:12px">Last backup: ${S.lastBackup?fmtD(S.lastBackup):'never'}. Data stays only in this browser on this phone.</small>
 </div>
 <input type="file" id="file" accept="application/json" hidden>
 </div>`}

/* ---------- Months ---------- */
function chartBlock(){var ks=allKeys().slice(-12);
 var mx=Math.max(1,...ks.map(k=>Math.max(getM(k).planned||0,mOut(k)))),W=540,H=170,gw=W/Math.max(ks.length,6),bw=gw*.34;
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Last 12 months">${ks.map((k,i)=>{var m=+k.slice(5,7)-1,p=(getM(k).planned||0)/mx*112,e=mOut(k)/mx*112,x=i*gw+gw*.1,lab=(m==0||i==0)?MO[m]+' '+k.slice(2,4):MO[m];
 return `<rect x="${x}" y="${122-p}" width="${bw}" height="${p}" rx="4" fill="var(--a1)"/><rect x="${x+bw+2}" y="${122-e}" width="${bw}" height="${e}" rx="4" fill="var(--a3)"/><text x="${x+bw}" y="150" font-size="10" fill="var(--mute)" text-anchor="middle">${lab}</text>`}).join('')}</svg>
 <div class="leg" style="margin-top:8px"><span><u style="background:var(--a1)"></u>Planned savings</span><span><u style="background:var(--a3)"></u>Emergency expense</span></div>`}

function thisMonth(){var k=CUR(),o=getM(k),sp=mExp(k),bd=o.budget||0,ac=actual(k),left=bd?bd-sp:null;
 return `<div class="sec"><span>This month · ${mlabel(k)}</span></div><div class="card"><div class="stats3"><div><div class="lbl">Actual left</div><b class="${cls(ac)}">${inr(ac)}</b></div><div><div class="lbl">Spent (Spend)</div><b>${inr(sp)}</b></div><div><div class="lbl">Budget</div><b class="${left==null?'':cls(left)}">${left==null?'—':(left>=0?inr(left)+' left':inr(-left)+' over')}</b></div></div>${bd?bar(sp/bd*100,sp>bd?'bad':sp/bd>.8?'warn':'good'):''}</div>`}
function months(){
 var keys=monthKeys().slice().reverse(),cnt=keys.length,sal=sum(keys,k=>getM(k).salary||0),used=sum(keys,mOut),sv=sum(keys,actual);
 var pend=monthKeys().filter(k=>k<CUR()&&!isClosed(k));
 return `<div class="fade">
 ${pend.length?`<div class="warnbox"><b>${mlabel(pend[0])}</b> looks finished. Close it to lock its numbers.<div style="margin-top:8px"><button class="btn ghost" data-act="closem" data-i="${pend[0]}">Close ${mlabel(pend[0])}</button></div></div>`:''}
 ${thisMonth()}<div class="sec"><span>Last 12 months</span></div>
 <div class="card">${chartBlock()}</div>
 <div class="grid">
  <div class="tile"><span class="corner">${cnt} mo</span><div class="lbl">Salary</div><b>${inr(sal)}</b></div>
  <div class="tile"><span class="corner">${cnt} mo</span><div class="lbl">Emergency use</div><b>${inr(used)}</b></div>
  <div class="tile"><span class="corner">${cnt} mo</span><div class="lbl">Actual savings</div><b class="${cls(sv)}">${inr(sv)}</b></div>
  <div class="tile"><span class="corner">${cnt} mo</span><div class="lbl">Saving rate</div><b>${sal?(sv/sal*100).toFixed(0):0}%</b></div>
 </div>
 <div class="sec"><span>Add month</span></div>
 <form data-k="months" style="margin-top:0"><input name="k" type="month" value="${CUR()}" required><button class="btn">Add</button></form>
 <div class="sec"><span>Months</span></div>
 ${keys.length?keys.map(k=>{var o=getM(k),cl=isClosed(k),u=mOut(k),ac=(o.planned||0)-u;
 return `<div class="card mc ${cl?'lock':''}">
  <div class="mh"><b>${mlabel(k)}</b><div style="display:flex;gap:6px;align-items:center"><span class="pill ${cl?'':'g'}">${cl?'Closed':'Open'}</span><button class="ico d" data-act="delm" data-i="${k}" aria-label="Delete month">${ICO_DEL}</button></div></div>
  <div class="fields2"><label>Salary<input data-sal="${k}" type="number" inputmode="decimal" step="any" value="${o.salary||''}" placeholder="0" ${cl?'disabled':''}></label><label>Planned savings<input data-plan="${k}" type="number" inputmode="decimal" step="any" value="${o.planned||''}" placeholder="0" ${cl?'disabled':''}></label></div>
  <div class="fields2"><label>Emergency expense<input data-mex="${k}" type="number" inputmode="decimal" step="any" value="${o.mexp||''}" placeholder="0" ${cl?'disabled':''}></label><div><div class="lbl">Actual savings</div><div class="amt ${cls(ac)}" style="font-size:20px;margin-top:6px">${inr(ac)}</div></div></div>
  <div class="acts">${cl?`<button class="link" data-act="reopen" data-i="${k}">Reopen month</button>`:`<button class="link" data-act="closem" data-i="${k}">Close month</button>`}</div>
 </div>`}).join(''):'<div class="card">'+emptyBox('📅','No months yet','Add a month above to start tracking.')+'</div>'}
 </div>`}

/* ---------- Spend ---------- */
function recBlock(){return `<div class="sec"><span>Recurring</span></div>
 <div class="card">${S.rec.length?S.rec.map((r,i)=>`<div class="row"><div class="ic">${cicon(cname(r.c))}</div><div class="grow"><b>${esc(r.n)}</b><small>${esc(cname(r.c))} · every month, day ${r.day}</small></div><div class="amt">${inr(r.a)}</div>${del('rec',i)}</div>`).join(''):'<div class="empty">Rent or subscriptions you pay every month.</div>'}</div>
 <form data-k="rec"><input name="n" placeholder="Name" required><select name="c">${catOpts('Rent')}</select><input name="a" type="number" inputmode="decimal" step="any" placeholder="Amount ₹" required><input name="day" type="number" inputmode="numeric" min="1" max="28" placeholder="Day"><button class="btn">Add</button></form>`}

var srch='';
function matchQ(e,q){q=q.trim().toLowerCase();return (e.n||'').toLowerCase().includes(q)||cname(e.c).toLowerCase().includes(q)||String(e.a).includes(q)||e.d.includes(q)}
function spend(){
 var keys=allKeys(),k=selM&&keys.indexOf(selM)>-1?selM:CUR(),cl=isClosed(k),o=getM(k),bd=o.budget||0,
 ex=S.exp.filter(e=>e.d.slice(0,7)==k),mt=sum(ex,e=>e.a),over=bd>0&&mt>bd,prevK=addMK(k,-1),
 spent=sk=>sum(S.exp.filter(e=>e.d.slice(0,7)==sk),e=>e.a),
 sk2=allKeys().filter(q=>spent(q)>0),avg=sk2.length?sum(sk2,spent)/sk2.length:0,
 fixedRow=n=>{var now=sum(ex.filter(e=>cname(e.c)==n),e=>e.a),pv=sum(S.exp.filter(e=>e.d.slice(0,7)==prevK&&cname(e.c)==n),e=>e.a),dl=now-pv;
  return `<div class="row"><div class="ic">${cicon(n)}</div><div class="grow"><b>${n}</b><small>${now==0&&pv==0?'<span>Not this month</span>':pv?(dl>0?`<span class="n">▲ ${inr(dl)}</span> vs last month`:dl<0?`<span class="p">▼ ${inr(-dl)}</span> vs last month`:'same as last month'):'not used last month'}</small></div><div class="amt">${inr(now)}</div></div>`},
 regular={};ex.forEach(e=>{var n=cname(e.c);if(FIXED.indexOf(n)<0)regular[n]=(regular[n]||0)+e.a});
 var rows=Object.keys(regular).sort((a,b)=>regular[b]-regular[a]),mx=rows.length?regular[rows[0]]:1;
 var src=srch.trim()?S.exp.filter(e=>matchQ(e,srch)):ex,groups={};src.slice().sort((a,b)=>a.d<b.d?1:-1).forEach(e=>{(groups[e.d]=groups[e.d]||[]).push(e)});
 return `<div class="fade">
 <div class="mpick"><button data-act="mprev" aria-label="Previous month">‹</button><select id="msel">${keys.slice().reverse().map(x=>`<option value="${x}"${x==k?' selected':''}>${mlabel(x)}${isClosed(x)?' · closed':''}</option>`).join('')}</select><button data-act="mnext" aria-label="Next month">›</button></div>
 <div class="card">
  <div class="summary"><div><div class="lbl">Spent · ${mlabel(k)}</div><div class="big" style="font-size:28px">${inr(mt)}</div></div>
   <div class="s" style="text-align:right"><small>Average / month</small><b>${sk2.length?inr(avg):'—'}</b></div></div>
  ${bd>0?bar(mt/bd*100,over?'bad':mt/bd>.8?'warn':'good'):''}
  <div class="fields" style="grid-template-columns:1fr auto;align-items:center"><small>${bd>0?(over?`<span class="n">${inr(mt-bd)} over budget</span>`:`${inr(bd-mt)} left of ${inr(bd)}`):'Monthly budget'}</small><input id="bud" type="number" inputmode="decimal" step="any" value="${bd||''}" placeholder="Budget ₹" style="width:130px;flex:none" ${cl?'disabled':''}></div>
 </div>

 <div class="sec"><span>Add expense</span></div>
 ${cl?'<div class="card empty">This month is closed. Reopen it from Months to add expenses.</div>':`<div class="card" style="padding:12px">${expForm(k==CUR()?today():k+'-01')}</div>`}

 <div class="sec"><span>Fixed & shared</span></div>
 <div class="card">${FIXED.map(fixedRow).join('')}</div>

 <div class="sec"><span>By category</span></div>
 <div class="card">${rows.length?rows.map(n=>`<div class="row"><div class="ic">${cicon(n)}</div><div class="grow"><b>${n}</b>${bar(regular[n]/mx*100)}</div><div class="amt">${inr(regular[n])}</div></div>`).join(''):emptyBox('🧾','Nothing spent yet','Tap + to add your first expense.')}</div>

 ${recBlock()}

 <div class="sec"><span>${srch.trim()?'Results':'History'}</span><span>${src.length} entries</span></div><input id="srch" type="search" class="srch" placeholder="Search note, category or amount" value="${esc(srch)}">
 <div class="card">${src.length?Object.keys(groups).sort().reverse().map(d=>`<div class="dayh">${fmtD(d)}</div>`+groups[d].map(e=>{var idx=S.exp.indexOf(e),n=cname(e.c),fx=FIXED.indexOf(n)>-1;
  return `<div class="row"><div class="ic">${cicon(n)}</div><div class="grow"><b>${esc(e.n||n)}</b><small>${n}${fx?' · fixed':''}${e.auto?' · auto':''}</small></div><div class="amt">${inr(e.a)}</div>${cl?'':del('exp',idx)}</div>`}).join('')).join(''):'<div class="empty">No expenses in this month.</div>'}</div>
 </div>`}

/* ---------- Invest ---------- */
function holdView(k,title){var a=S[k],i=sum(a,x=>x.i),c=sum(a,x=>x.c),pl=c-i;
 return `<div class="card"><div class="stats3"><div><div class="lbl">Invested</div><b>${inr(i)}</b></div><div><div class="lbl">Current</div><b>${inr(c)}</b></div><div><div class="lbl">Gain / loss</div><b class="${cls(pl)}">${pl>=0?'+':''}${inr(pl)}</b><small class="${cls(pl)}">${pl>=0?'+':''}${pct(pl,i)}%</small></div></div></div>
 <div class="card" style="margin-top:10px">${a.length?a.map((x,j)=>{var d=x.c-x.i;return `<div class="row"><div class="grow"><div class="nm">${esc(x.n)}</div><div class="mt">Invested ${inr(x.i)}</div></div><div class="rt"><input class="cv" data-cv="${k},${j}" type="number" inputmode="decimal" step="any" value="${x.c}" aria-label="Current value"><div class="mt ${cls(d)}" style="margin:0">${d>=0?'+':''}${pct(d,x.i)}%</div></div>${del(k,j)}</div>`}).join(''):emptyBox('📈',`No ${title.toLowerCase()} yet`,'Add your first entry below.')}</div>
 <form data-k="${k}"><input name="n" placeholder="Name" required><input name="i" type="number" inputmode="decimal" step="any" placeholder="Invested ₹" required><input name="c" type="number" inputmode="decimal" step="any" placeholder="Current ₹"><button class="btn">Add</button></form>`}

function goldView(){var T0=today(),g=sum(S.gold,x=>x.g),cost=sum(S.gold,x=>x.g*x.r*(1+(x.gst||0)/100)),gv=goldVal(),gg=S.goldGst==null?3:S.goldGst,base=S.goldRate||0,gst=base*gg/100,incl=base+gst;
 return `<div class="card"><div class="stats3"><div><div class="lbl">Holding</div><b>${+g.toFixed(3)} g</b></div><div><div class="lbl">Cost</div><b>${inr(cost)}</b></div><div><div class="lbl">Value now</div><b class="${cls(gv-cost)}">${inr(gv)}</b></div></div></div>
 <div class="card" style="margin-top:10px">${S.gold.length?S.gold.map((x,i)=>{var b=x.g*x.r,t=b*(x.gst||0)/100;return `<div class="row"><div class="grow"><div class="nm">${x.g} g at ${inr(x.r)}</div><div class="mt">${fmtD(x.d)}</div><div class="mt">Base ${inr(b)} + GST ${x.gst||0}% (${inr(t)})</div></div><div class="rt"><div class="amt">${inr(b+t)}</div></div>${del('gold',i)}</div>`}).join(''):'<div class="empty">No gold bought yet.</div>'}</div>
 <form data-k="gold"><input name="d" type="date" value="${T0}" required><input name="g" type="number" inputmode="decimal" step="any" placeholder="Grams" required><input name="r" type="number" inputmode="decimal" step="any" placeholder="Rate ₹/g" required><input name="gst" type="number" inputmode="decimal" step="any" value="3" placeholder="GST %"><button class="btn">Add</button></form>
 <div class="card" style="margin-top:12px"><div class="hr"><div class="lbl">Today's 24K rate</div><div class="f" style="color:var(--a1)">${base?inr(incl)+' /g':'—'}</div></div>
  <div class="fields"><input id="grate" type="number" inputmode="decimal" step="any" value="${base||''}" placeholder="Base ₹ per gram"><input id="ggst" type="number" inputmode="decimal" step="any" value="${gg}" placeholder="GST %"></div>
  <div class="stats3" style="margin-top:12px"><div><div class="lbl">Base</div><b>${inr(base)}</b></div><div><div class="lbl">GST ${gg}%</div><b>${inr(gst)}</b></div><div><div class="lbl">With GST</div><b>${inr(incl)}</b></div></div>
  ${S.gold.length&&base?`<small style="display:block;margin-top:10px">Your ${+g.toFixed(3)} g is worth ${inr(g*incl)} today.</small>`:''}
 </div>`}

function quotaOK(p,d){var allowed=12/FQ[p.f||'yearly'][1];return p.pay.filter(x=>x.d.slice(0,4)==d.slice(0,4)).length<allowed}
function dueCls(d){return d<=0?'g':d<=7?'r':d<=30?'a':d<=90?'y':''}
function remCls(rem,total){if(rem<=0)return 'g';var r=rem/(total||1);return r>.5?'r':r>.2?'a':'y'}
function insView(){
 if(!S.ins.length)return `<div class="card"><div class="empty" style="padding-top:4px">No insurance policy added yet.</div></div>
  <form data-k="ins" style="margin-top:0"><input name="n" placeholder="Policy name" required><input name="p" type="number" inputmode="decimal" step="any" placeholder="Premium per payment ₹" required><select name="f">${Object.keys(FQ).map(k=>`<option value="${k}">${FQ[k][0]}</option>`).join('')}</select><input name="sa" type="number" inputmode="decimal" step="any" placeholder="Sum assured ₹"><label class="lb" style="flex:1 1 100%">Maturity date<input name="m" type="date"></label><button class="btn">Add policy</button></form>`;
 var p=S.ins[0],T0=today(),fk=p.f||'yearly',f=FQ[fk],last=p.pay.map(x=>x.d).sort().pop(),due=last?addMo(last,f[1]):T0,
 dd=Math.round((new Date(due+'T00:00:00')-new Date(T0+'T00:00:00'))/864e5),
 paid=sum(p.pay.filter(x=>x.d.startsWith(Y)),x=>x.a),total=sum(p.pay,x=>x.a),
 allowed=12/f[1],used=p.pay.filter(x=>x.d.startsWith(Y)).length,reached=used>=allowed,
 st=dd<0?`<span class="pill r">Overdue ${-dd}d</span>`:dd<=30?`<span class="pill a">In ${dd} day${dd==1?'':'s'}</span>`:`<span class="pill g">${fmtD(due)}</span>`;
 return `<div class="card">
  <div class="hr"><div class="grow"><b class="f" style="font-size:18px">${esc(p.n)}</b><small style="display:block">${inr(p.p)} ${f[0].toLowerCase()}${p.sa?' · sum assured '+inr(p.sa):''}</small></div>${del('ins',0)}</div>
  <div class="stats3" style="margin-top:14px"><div><div class="lbl">Paid ${Y}</div><b>${inr(paid)}</b></div><div><div class="lbl">Total paid</div><b class="p">${inr(total)}</b></div><div><div class="lbl">Next due</div><div style="margin-top:6px">${st}</div></div></div>
  <div class="fields" style="grid-template-columns:1fr 1fr;margin-top:12px">
   <select data-fq="0">${Object.keys(FQ).map(k=>`<option value="${k}"${fk==k?' selected':''}>${FQ[k][0]}</option>`).join('')}</select>
   <button class="btn" data-act="paynow" data-i="0" ${reached?'disabled':''}>${reached?'Paid for '+Y:'Paid today'}</button>
  </div>
 </div>
 <form data-k="inspay" style="margin-top:10px"><input type="hidden" name="i" value="0"><input name="d" type="date" value="${T0}" required><input name="a" type="number" inputmode="decimal" step="any" value="${p.p}" required><button class="btn">Add payment</button></form>
 <div class="card" style="margin-top:10px">${p.pay.length?p.pay.map((x,j)=>({x,j})).sort((a,b)=>a.x.d<b.x.d?1:-1).map(({x,j})=>`<div class="row"><div class="grow"><div class="nm">${inr(x.a)}</div><div class="mt">${fmtD(x.d)}</div></div><button class="ico" data-act="edit" data-k="ins" data-i="0" data-j="${j}" aria-label="Edit">${ICO_EDIT}</button><button class="ico d" data-act="delpay" data-k="ins" data-i="0" data-j="${j}" aria-label="Remove">${ICO_DEL}</button></div>`).join(''):'<div class="empty">No payments yet.</div>'}</div>`}

function fdView(){var L=S.fds.map((f,i)=>[f,i]).sort((a,b)=>a[0].m<b[0].m?-1:1),T=Date.now();
 return `<div class="card">${L.length?L.map(([f,i])=>{var dl=Math.ceil((new Date(f.m)-T)/864e5);
 return `<div class="row"><div class="grow"><div class="nm">${esc(f.n)}</div><div class="mt">${inr(f.a)} · ${f.r?f.r+'% p.a.':'rate not set'}</div><div class="mt">Matures ${fmtD(f.m)}</div></div><div class="rt"><div class="amt">${inr(fdEnd(f))}</div><span class="pill ${dueCls(dl)}">${dl<=0?'Matured':dl+' days left'}</span></div>${del('fds',i)}</div>`}).join(''):'<div class="empty">No fixed deposits yet.</div>'}</div>
 <form data-k="fds"><input name="n" placeholder="Bank" required><input name="a" type="number" inputmode="decimal" step="any" placeholder="Amount ₹" required><input name="r" type="number" inputmode="decimal" step="any" placeholder="Rate %"><label class="lb">Start date<input name="s" type="date"></label><label class="lb">Maturity date<input name="m" type="date" required></label><button class="btn">Add FD</button></form>`}

function sipView(){return `<div class="card"><div class="stats3"><div><div class="lbl">Per month</div><b>${inr(sum(S.sip,x=>x.a))}</b></div></div></div>
 <div class="card" style="margin-top:10px">${S.sip.length?S.sip.map((x,i)=>`<div class="row"><div class="grow"><div class="nm">${esc(x.n)}</div></div><div class="amt">${inr(x.a)}</div>${del('sip',i)}</div>`).join(''):'<div class="empty">No SIPs yet.</div>'}</div>
 <form data-k="sip"><input name="n" placeholder="Fund name" required><input name="a" type="number" inputmode="decimal" step="any" placeholder="Monthly ₹" required><button class="btn">Add</button></form>`}

function debtView(){var owe=sum(S.debts.filter(d=>d.dir=='owe'),d=>Math.max(0,d.a-(d.p||0))),due=sum(S.debts.filter(d=>d.dir=='due'),d=>Math.max(0,d.a-(d.p||0)));
 return `<div class="card"><div class="stats3"><div><div class="lbl">I owe</div><b class="n">${inr(owe)}</b></div><div><div class="lbl">Owed to me</div><b class="p">${inr(due)}</b></div></div></div>
 <div class="card" style="margin-top:10px">${S.debts.length?S.debts.map((d,i)=>{var rem=d.a-(d.p||0),dir=d.dir=='owe'?'n':'p';return `<div class="row"><div class="grow"><div class="nm">${esc(d.n)}</div><div class="mt ${dir}">${d.dir=='owe'?'I owe':'Owed to me'} · total ${inr(d.a)}</div></div><div class="rt"><input class="cv" data-dp="${i}" type="number" inputmode="decimal" step="any" value="${d.p||0}" aria-label="Paid so far"><span class="pill ${remCls(rem,d.a)}">${rem<=0?'Settled':inr(rem)+' left'}</span></div>${del('debts',i)}</div>`}).join(''):'<div class="empty">No debts recorded.</div>'}</div>
 <form data-k="debts"><input name="n" placeholder="Name" required><input name="a" type="number" inputmode="decimal" step="any" placeholder="Amount ₹" required><select name="dir"><option value="owe">I owe</option><option value="due">Owed to me</option></select><button class="btn">Add</button></form>`}

function invest(){
 var subs=[['mf','Funds'],['st','Stocks'],['gold','Gold'],['fd','FDs'],['sip','SIP'],['ins','Insurance'],['debt','Debts']],body;
 if(sub=='mf')body=holdView('mf','Funds');
 else if(sub=='st')body=holdView('st','Stocks');
 else if(sub=='gold')body=goldView();
 else if(sub=='fd')body=fdView();
 else if(sub=='sip')body=sipView();
 else if(sub=='ins')body=insView();
 else body=debtView();
 return `<div class="chips">${subs.map(s=>`<button class="chip ${sub==s[0]?'on':''}" data-act="sub" data-s="${s[0]}">${s[1]}</button>`).join('')}</div><div class="fade">${body}</div>`}

/* ---------- shell ---------- */
var T=[['home','🏠','Home'],['months','📅','Months'],['spend','💸','Spend'],['invest','📈','Invest']];
function header(){return `<div class="top"><div class="tl"><div>🎮 LOOT <span>VAULT</span></div><button class="qa" data-act="fab" aria-label="Add expense">+</button></div>
 <div class="status">${OK?'Saved on this device':'Storage unavailable — data will not persist'} · ${new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</div></div>`}
function renderDock(){var d=document.getElementById('dock'),ix=T.findIndex(t=>t[0]==tab);
 if(!d.querySelector('.ind'))d.innerHTML='<span class="ind"></span>'+T.map(t=>`<button data-act="tab" data-t="${t[0]}" aria-label="${t[2]}"><span class="di">${t[1]}</span>${t[2]}</button>`).join('');
 d.querySelector('.ind').style.setProperty('--i',ix);
 d.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i==ix))}
function render(){
 document.documentElement.dataset.t=S.theme||'noir';
 document.getElementById('app').innerHTML=header()+({home,months,spend,invest})[tab]();renderDock();
}
function go(t){tab=t;render();countUp();scrollTo(0,0)}
function countUp(){document.querySelectorAll('[data-count]').forEach(el=>{var end=+el.dataset.count,t0=performance.now();function f(t){var p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);el.textContent=inr(Math.round(end*e));if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)})}
function sheet(o){var s=document.getElementById('sheet');if(o)s.firstElementChild.innerHTML=`<h2>Add expense</h2>`+expForm(today());s.classList.toggle('open',!!o)}

/* ---------- events ---------- */
document.addEventListener('submit',ev=>{var f=ev.target,k=f.dataset.k;if(!k)return;ev.preventDefault();var v=Object.fromEntries(new FormData(f));
 if(k=='pinset'){if(!/^\d{4}$/.test(v.p)){toast('PIN must be 4 digits');return}sha(v.p).then(x=>{localStorage.setItem(PIN_KEY,x);sheet(false);render();toast('App lock is on')});return}
 if(k=='edit'){if(!applyEdit(v))return;toast('Updated')}
 else if(k=='opening'||k=='sip'){S[k].push({n:v.n.trim(),a:+v.a});toast('Added')}
 else if(k=='exp'){if(isClosed(v.d.slice(0,7))){toast('This month is closed');return}S.exp.push({d:v.d,c:v.c,n:(v.n||'').trim()||v.c,a:+v.a});selM=v.d.slice(0,7);toast('Expense added')}
 else if(k=='gold'){S.gold.push({d:v.d,g:+v.g,r:+v.r,gst:+v.gst||0});toast('Gold added')}
 else if(k=='mf'||k=='st'){S[k].push({n:v.n.trim(),i:+v.i,c:v.c===''||v.c==null?+v.i:+v.c});toast('Added')}
 else if(k=='months'){if(S.months.some(o=>o.k==v.k)){toast('Month already exists');return}
   var prev=S.months.filter(o=>o.k<v.k).sort((a,b)=>a.k<b.k?1:-1)[0];
   S.months.push({k:v.k,salary:prev?prev.salary||0:0,planned:prev?prev.planned||0:0,budget:0,mexp:0});toast('Month added')}
 else if(k=='rec'){S.rec.push({n:v.n.trim(),c:v.c,a:+v.a,day:+v.day||1,last:''});applyRec();toast('Recurring added')}
 else if(k=='debts'){S.debts.push({n:v.n.trim(),a:+v.a,p:0,dir:v.dir});toast('Added')}
 else if(k=='fds'){S.fds.push({n:v.n.trim(),a:+v.a,r:+v.r||0,s:v.s,m:v.m});toast('FD added')}
 else if(k=='ins'){if(S.ins.length){toast('Only one policy is allowed');return}S.ins.push({n:v.n.trim(),p:+v.p,f:v.f||'yearly',sa:+v.sa||0,m:v.m||'',pay:[]});toast('Policy added')}
 else if(k=='inspay'){var pp=S.ins[+v.i];if(!quotaOK(pp,v.d)){toast('Payment limit reached for '+v.d.slice(0,4));return}pp.pay.push({d:v.d,a:+v.a});toast('Payment added')}
 else if(k=='goals'){S.goals.push({n:v.n.trim(),t:+v.t||1,s:0});toast('Goal added')}
 save();sheet(false);render()});

document.addEventListener('change',ev=>{var t=ev.target,d=t.dataset,v=+t.value||0;
 if(t.id=='msel'){selM=t.value;render();return}
 if(d.fq!==undefined){S.ins[+d.fq].f=t.value}
 else if(d.sal!==undefined){if(isClosed(d.sal))return;ensureM(d.sal).salary=v}
 else if(d.plan!==undefined){if(isClosed(d.plan))return;ensureM(d.plan).planned=v}
 else if(d.mex!==undefined){if(isClosed(d.mex))return;ensureM(d.mex).mexp=v}
 else if(t.id=='bud'){var k=selM||CUR();if(isClosed(k))return;ensureM(k).budget=v}
 else if(d.cv){var p=d.cv.split(',');S[p[0]][+p[1]].c=v}
 else if(d.gs!==undefined)S.goals[+d.gs].s=v;
 else if(t.id=='gname')S.goalName=t.value;
 else if(t.id=='target')S.target=v;
 else if(t.id=='reserve')S.reserve=v;
 else if(d.dp!==undefined)S.debts[+d.dp].p=v;
 else if(t.id=='grate')S.goldRate=v;
 else if(t.id=='ggst')S.goldGst=v;
 else if(t.id=='file'&&t.files[0]){var r=new FileReader();r.onload=()=>{try{var x=JSON.parse(r.result);if(!x||!Array.isArray(x.exp))throw 0;S=migrate(x);save();render();toast('Backup restored')}catch(e){toast('Not a valid backup file')}};r.readAsText(t.files[0]);return}
 else return;
 save();render()});

document.addEventListener('click',ev=>{if(ev.target.id=='sheet')return sheet(false);var b=ev.target.closest('[data-act]');if(!b)return;
 if(b.dataset.act=='undo'){var uf=toast.u;toast.u=null;document.getElementById('toast').classList.remove('on');if(uf)uf();return}
 if(b.dataset.act=='pk')return pinPress(b.dataset.d);
 if(b.dataset.act=='pinset')return openPinSet();
 if(b.dataset.act=='pinrm'&&confirm('Remove the app lock?')){localStorage.removeItem(PIN_KEY);save();render();toast('App lock removed');return}
 var a=b.dataset.act,k=b.dataset.k,i=b.dataset.i,j=b.dataset.j;
 if(a=='amt'){b.form.a.value=b.dataset.v;return}
 if(a=='note'){var nf=b.form;nf.n.value=b.dataset.v;nf.n.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(a=='onbdone'){localStorage.setItem('lv-onb','1');render();return}
 if(a=='tab')return go(b.dataset.t);
 if(a=='sub'){sub=b.dataset.s;render();return}
 if(a=='ach'){achSel=achSel==+i?-1:+i;render();return}
 if(a=='fab')return sheet(true);
 if(a=='closesheet')return sheet(false);
 if(a=='edit')return openEdit(k,i,j);
 if(a=='del'){if(k=='exp'){var e=S.exp[+i];if(e&&isClosed(e.d.slice(0,7))){toast('This month is closed');return}}
   if(confirm('Delete this entry?')){var it=S[k][+i],ix=+i;S[k].splice(ix,1);save();render();toast('Deleted',()=>{S[k].splice(Math.min(ix,S[k].length),0,it);save();render();toast('Restored')})}return}
 if(a=='delpay'&&confirm('Remove this payment?')){var pi=+i,pj=+j,pit=S[k][pi].pay[pj];S[k][pi].pay.splice(pj,1);save();render();toast('Removed',()=>{S[k][pi].pay.splice(pj,0,pit);save();render();toast('Restored')});return}
 if(a=='delm'&&confirm('Delete this month? Its salary, savings and emergency values will be removed.')){var om=S.months.find(o=>o.k==i),wc=isClosed(i);S.months=S.months.filter(o=>o.k!=i);S.closed=S.closed.filter(x=>x!=i);save();render();toast('Month deleted',()=>{if(om)S.months.push(om);if(wc)S.closed.push(i);save();render();toast('Restored')});return}
 if(a=='closem'&&confirm('Close '+mlabel(i)+'? It will be locked until you reopen it.')){S.closed.push(i);save();render();toast(mlabel(i)+' closed');return}
 if(a=='reopen'){S.closed=S.closed.filter(x=>x!=i);save();render();toast('Month reopened');return}
 if(a=='mprev'||a=='mnext'){var L=allKeys(),ix=L.indexOf(selM||CUR()),n=L[ix+(a=='mprev'?-1:1)];if(n){selM=n;render()}return}
 if(a=='paynow'){var p=S.ins[+i];if(!quotaOK(p,today())){toast('Yearly payment already recorded for '+Y);return}p.pay.push({d:today(),a:p.p});save();render();toast('Premium recorded');return}
 if(a=='theme'){S.theme=b.dataset.t;save();render();return}
 if(a=='export'){S.lastBackup=today();save();dl(JSON.stringify(S,null,1),'loot-vault-backup-'+today()+'.json','application/json');render();toast('Backup exported');return}
 if(a=='import')return document.getElementById('file').click();
 if(a=='csv')return downloadCSV()});

function dl(txt,name,type){var u=URL.createObjectURL(new Blob([txt],{type:type})),l=document.createElement('a');l.href=u;l.download=name;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function downloadCSV(){var rows=[['Section','Date','Name','Category','Amount','Note']];
 S.exp.forEach(e=>rows.push(['Expense',e.d,e.n,cname(e.c),e.a,e.auto?'auto':'']));
 monthKeys().forEach(k=>{var o=getM(k);rows.push(['Month',k,'Salary','',o.salary||0,'']);rows.push(['Month',k,'Planned savings','',o.planned||0,'']);rows.push(['Month',k,'Emergency expense','',mOut(k),'']);rows.push(['Month',k,'Actual savings','',actual(k),isClosed(k)?'closed':'open'])});
 S.ins.forEach(p=>p.pay.forEach(x=>rows.push(['Insurance',x.d,p.n,'',x.a,p.f||'yearly'])));
 S.fds.forEach(f=>rows.push(['FD',f.m,f.n,'',f.a,(f.r||0)+'% from '+(f.s||'')]));
 S.mf.forEach(x=>rows.push(['Fund','',x.n,'',x.c,'invested '+x.i]));
 S.st.forEach(x=>rows.push(['Stock','',x.n,'',x.c,'invested '+x.i]));
 S.sip.forEach(x=>rows.push(['SIP','',x.n,'',x.a,'monthly']));
 S.gold.forEach(x=>rows.push(['Gold',x.d,x.g+' g','',x.g*x.r*(1+(x.gst||0)/100),'@ '+x.r+' + GST '+(x.gst||0)+'%']));
 S.debts.forEach(d=>rows.push(['Debt','',d.n,d.dir,d.a,'paid '+(d.p||0)]));
 S.opening.forEach(x=>rows.push(['Opening savings','',x.n,'',x.a,'']));
 dl(rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'loot-vault-'+today()+'.csv','text/csv')}

document.addEventListener('input',e=>{if(e.target.id=='srch'){srch=e.target.value;render();var el=document.getElementById('srch');el.focus();el.setSelectionRange(srch.length,srch.length)}});
document.addEventListener('input',e=>{var t=e.target;if(t.name!='n'||!t.form||t.form.dataset.k!='exp')return;var q=t.value.trim().toLowerCase();if(q.length<2)return;
 var list=S.exp.slice().reverse().filter(x=>!x.auto&&x.n);var m=list.find(x=>x.n.trim().toLowerCase()==q)||list.find(x=>x.n.trim().toLowerCase().startsWith(q));
 if(m){var nm=cname(m.c),sel=t.form.c;for(var o of sel.options){if(o.value==nm){sel.value=nm;break}}}});
var tx,ty;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty,L=T.map(q=>q[0]),j=L.indexOf(tab)+(dx<0?1:-1);
 if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||Math.abs(dx)<80||Math.abs(dy)>60||document.getElementById('sheet').classList.contains('open'))return;if(L[j])go(L[j])},{passive:true});
document.addEventListener('keydown',e=>{if(e.key=='Escape')sheet(false)});

var PIN_KEY='lv-pin',pinBuf='';
function sha(s){if(window.crypto&&crypto.subtle)return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''));return Promise.resolve('h'+s.split('').reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))}
function drawDots(){document.querySelectorAll('#dots span').forEach((s,i)=>s.classList.toggle('f',i<pinBuf.length))}
function showLock(on){var L=document.getElementById('lock');L.classList.toggle('on',on);L.classList.remove('shake');pinBuf='';drawDots()}
function pinPress(d){if(d=='b')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=d;drawDots();
 if(pinBuf.length==4){var typed=pinBuf;sha(typed).then(x=>{if(x===localStorage.getItem(PIN_KEY)){showLock(false)}else{var L=document.getElementById('lock');L.classList.remove('shake');void L.offsetWidth;L.classList.add('shake');pinBuf='';drawDots();toast('Wrong PIN')}})}}
function openPinSet(){var s=document.getElementById('sheet');s.firstElementChild.innerHTML=`<h2>${localStorage.getItem(PIN_KEY)?'Change PIN':'Set PIN'}</h2><form data-k="pinset" style="margin-top:0"><input name="p" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" required><button class="btn">Save PIN</button></form><small style="display:block;margin-top:10px">Keeps the app locked when you open or switch away. Your data is not encrypted.</small>`;s.classList.add('open')}
applyRec();render();
if(localStorage.getItem(PIN_KEY))showLock(true);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&localStorage.getItem(PIN_KEY))showLock(true)});
</script></body></html>
