<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Loot Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--card:#131215;--line:#2b2619;--ink:#f3ead8;--mute:#9a8f78;--a1:#e3b84a;--a2:#b8862b;--a3:#d2792f;--hero:#1e1810;--gl:#e3b84a30;--gr:#8fe388;--rd:#ff5d5d;--go:#ffd23f;color-scheme:dark}
html[data-t=emerald]{--bg:#06100d;--card:#0d1b17;--line:#1f3a31;--ink:#e6f5ee;--mute:#7fa394;--a1:#3ddc97;--a2:#1f9d6b;--a3:#c6e84a;--hero:#0f2a21;--gl:#3ddc9730}
html[data-t=royal]{--bg:#0a0614;--card:#140d2b;--line:#2d1f5e;--ink:#eae6ff;--mute:#8f86b8;--a1:#22e4ff;--a2:#8b5cf6;--a3:#ff2e97;--hero:#271456;--gl:#8b5cf655;--gr:#a3ff3c}
html[data-t=crimson]{--bg:#0d0708;--card:#1a0e10;--line:#3a1b20;--ink:#f6e8e9;--mute:#a58389;--a1:#ff5a6a;--a2:#b3202f;--a3:#ff9a5a;--hero:#2c0f14;--gl:#ff5a6a30}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(800px 380px at 85% -8%,var(--gl),transparent),radial-gradient(600px 380px at -10% 8%,var(--gl),transparent),var(--bg);color:var(--ink);font:500 17px/1.4 Rajdhani,system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top,0) 0 calc(40px + env(safe-area-inset-bottom,0));font-variant-numeric:tabular-nums;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:14px;min-width:0}
.f,h2,.big{font-family:Orbitron,system-ui,sans-serif}
h2{font-size:13px;letter-spacing:.06em;margin:22px 0 10px;color:var(--a1);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
small,.mute{color:var(--mute);font-size:13.5px}
.card,.tile{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,#fff),var(--card));border:1px solid var(--line);border-radius:16px}
.card{padding:4px 14px}.pad{padding:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{position:relative;overflow:hidden;padding:12px 12px 12px 16px;min-width:0}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--a1),var(--a3))}
.tile b{display:block;font-size:17px;margin-top:2px;word-break:break-word}
.corner{position:absolute;top:9px;right:10px;font-size:11px;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:1px 7px}
.hero{border:1px solid var(--a2);border-radius:18px;padding:16px;background:linear-gradient(135deg,var(--hero),var(--card));box-shadow:0 0 24px var(--gl)}
.hr{display:flex;justify-content:space-between;align-items:center;gap:12px}
.big{font-size:30px;font-weight:800;color:var(--a1);text-shadow:0 0 14px var(--gl);margin:2px 0 4px;word-break:break-all}
.ring{flex:none;width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--a1) var(--p),var(--line) 0);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring::before{content:"";position:absolute;inset:6px;background:var(--hero);border-radius:50%}
.ring>*{position:relative;line-height:1}.ring b{font-size:24px;color:var(--a1)}.ring small{font-size:9px;margin-top:2px}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:14px 0 8px;background:var(--bg)}.stack i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mute);margin-bottom:8px}.leg u{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.bar{height:11px;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a2),var(--a1));box-shadow:0 0 10px var(--gl);transition:width .4s}
.bar.pk i{background:linear-gradient(90deg,var(--a3),var(--go))}
.bar.gr i{background:linear-gradient(90deg,#27c46b,var(--gr))}
.bar.bad i{background:var(--rd)}
.bd{display:flex;flex-wrap:wrap;gap:8px}
.bd span{padding:6px 11px;border-radius:20px;border:1px solid var(--line);font-size:14px;color:var(--mute);filter:grayscale(1);opacity:.55}
.bd span.on{filter:none;opacity:1;color:var(--ink);border-color:var(--a1);box-shadow:0 0 10px var(--gl)}
.row{display:flex;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}.grow{flex:1;min-width:0;word-break:break-word}.row small{display:block}
.amt{font-weight:700;white-space:nowrap}.r{text-align:right}
.p{color:var(--gr)}.n{color:var(--rd)}.tot{font-weight:700}
.x{background:none;border:0;color:var(--mute);font-size:18px;padding:2px 5px;cursor:pointer;line-height:1}
form{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;flex:1 1 90px;max-width:100%}
input:focus,select:focus{outline:0;border-color:var(--a1);box-shadow:0 0 8px var(--gl)}
input:disabled{opacity:.5}
.btn{font:inherit;font-weight:700;background:linear-gradient(90deg,var(--a3),var(--a1));color:var(--bg);border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
.btn:disabled{opacity:.5}
.ghost{background:none;border:1px solid var(--line);color:var(--a1)}
.cv{flex:none;width:110px;text-align:right;padding:7px 9px}
.lb{flex:1 1 140px;font-size:13px;color:var(--mute);min-width:0}.lb input,.lb select{width:100%;margin-top:3px}
.mc{padding:12px;margin-bottom:10px}
.mc .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:12px;border:1px solid var(--line);border-radius:10px;padding:2px 8px;color:var(--mute);white-space:nowrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.g2 label{font-size:13px;color:var(--mute);min-width:0}.g2 input{width:100%;margin-top:3px;padding:8px 10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.kv>div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.kv b{display:block;font-size:17px;word-break:break-word}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acts button{background:none;border:1px solid var(--line);color:var(--a1);border-radius:10px;padding:6px 10px;font:600 14px Rajdhani,system-ui;cursor:pointer}
.warn{border:1px solid var(--rd);background:color-mix(in srgb,var(--rd) 14%,transparent);color:var(--ink);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.warn b{color:var(--rd)}
.lock{opacity:.78}
.cat{display:grid;grid-template-columns:90px 1fr 76px;gap:8px;align-items:center;font-size:15px;margin:6px 0}
.cat .bar{margin:0}.cat span:last-child{text-align:right}
.empty{color:var(--mute);padding:12px 0;font-size:15px}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);cursor:pointer}.sw.on{border-color:var(--ink);box-shadow:0 0 10px var(--gl)}
.mpick{display:flex;gap:8px;align-items:center;margin:4px 0 12px}
.mpick select{flex:1;font-family:Orbitron,system-ui;font-size:14px}
.mpick button{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--a1);font-size:22px;cursor:pointer}
.top{position:sticky;top:0;z-index:4;margin:-14px -14px 14px;padding:12px 14px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tl{display:flex;justify-content:space-between;align-items:center;gap:10px;font:800 17px Orbitron,system-ui}
.tl span{color:var(--a3)}
.qa{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--a3),var(--a2));color:var(--bg);font:700 24px system-ui;line-height:1;box-shadow:0 0 14px var(--gl);cursor:pointer}
.status{font:500 14px Rajdhani,system-ui;color:var(--mute)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:2px 0;width:100%}
.tabs button{min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;font:700 14px Rajdhani,system-ui;letter-spacing:.02em;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.2s}
.tabs button.on{color:var(--bg);background:linear-gradient(90deg,var(--a1),var(--a3));border-color:transparent;box-shadow:0 0 14px var(--gl)}
.chart{display:grid}
#sheet{position:fixed;inset:0;z-index:9;display:none;background:#000b;align-items:flex-end}
#sheet.open{display:flex}
#sheet>div{width:100%;max-height:88vh;overflow:auto;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:var(--card);border:1px solid var(--a1);color:var(--ink);padding:10px 16px;border-radius:14px;box-shadow:0 8px 24px #000a;opacity:0;transition:.25s;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.in{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><main id="app"></main><div id="sheet"><div></div></div><div id="toast"></div>
<script>
var KEY='paisa-tracker-v1',Y=new Date().getFullYear(),MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
CATS=['🍔 Food','🏠 Bills','⛽ Travel','🛒 Shopping','🎮 Fun','💊 Health','💳 EMI','📦 Other'],
FQ={yearly:['Yearly',12],half:['Half-yearly',6],quarterly:['Quarterly',3],monthly:['Monthly',1]},
tab='home',selM=null;

var blank=()=>({opening:[],months:[],closed:[],exp:[],rec:[],sip:[],mf:[],st:[],gold:[],fds:[],ins:[],goals:[],debts:[],target:0,reserve:100000,goldRate:0,goldGst:3,theme:'noir',lastBackup:''});
function migrate(d){var s=Object.assign(blank(),d);if(!d.months&&Array.isArray(d.salary))s.months=d.salary.map((v,m)=>({k:Y+'-'+String(m+1).padStart(2,'0'),salary:v||0,planned:(d.planned||[])[m]||0,budget:0})).filter(x=>x.salary||x.planned);s.closed=s.closed||[];return s}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&typeof d=='object')return migrate(d)}catch(e){}return blank()}
var S=load(),OK=true;
try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){OK=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){OK=false}}
try{navigator.storage.persist()}catch(e){}

var inr=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0),
clamp=p=>Math.max(0,Math.min(100,p)),
cls=n=>n<0?'n':'p',
pn=(d,b)=>(d<0?'−':'+')+inr(Math.abs(d))+' ('+(b?(d/b*100).toFixed(1):'0')+'%)',
bar=(p,c)=>`<div class="bar ${c||''}"><i style="width:${clamp(p)}%"></i></div>`,
del=(k,i)=>`<button class="x" data-act="edit" data-k="${k}" data-i="${i}" aria-label="Edit">✏️</button><button class="x" data-act="del" data-k="${k}" data-i="${i}" aria-label="Delete">×</button>`,
today=()=>{var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
CUR=()=>today().slice(0,7),
fmtD=d=>{if(!d)return'';return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})},
mlabel=k=>MO[+k.slice(5)-1]+' '+k.slice(0,4),
toast=m=>{var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)};

/* ---------- money logic ---------- */
function allKeys(){var s={};S.months.forEach(o=>s[o.k]=1);S.exp.forEach(e=>s[e.d.slice(0,7)]=1);s[CUR()]=1;return Object.keys(s).sort()}
function getM(k){return S.months.find(o=>o.k==k)||{k:k,salary:0,planned:0,budget:0}}
function ensureM(k){var o=S.months.find(x=>x.k==k);if(!o){o={k:k,salary:0,planned:0,budget:0};S.months.push(o)}return o}
function isClosed(k){return S.closed.indexOf(k)>-1}
function mExp(k){return sum(S.exp.filter(e=>e.d.slice(0,7)==k),e=>e.a)}
function mOut(k){return getM(k).mexp||0}
function actual(k){return (getM(k).planned||0)-mOut(k)}
function savedToDate(){return sum(allKeys().filter(k=>k<=CUR()),actual)}
function openingSum(){return sum(S.opening,x=>x.a)}
function goldVal(){var g=sum(S.gold,x=>x.g),incl=(S.goldRate||0)*(1+(S.goldGst==null?3:S.goldGst)/100);return incl>0?g*incl:sum(S.gold,x=>x.g*x.r*(1+(x.gst||0)/100))}
function fdVal(f,at){if(!f.r||!f.s)return f.a;var t=Math.max(0,(new Date(at)-new Date(f.s))/315576e5);return f.a*Math.pow(1+f.r/400,4*t)}
var fdNow=f=>fdVal(f,Math.min(Date.now(),new Date(f.m))),fdEnd=f=>fdVal(f,f.m);
function addMo(d,m){var x=new Date(d+'T00:00:00');x.setMonth(x.getMonth()+m);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function applyRec(){var ym=CUR(),ch=false;S.rec.forEach(r=>{if(r.last!==ym){var dd=Math.min(Math.max(+r.day||1,1),28);S.exp.push({d:ym+'-'+String(dd).padStart(2,'0'),c:r.c,n:r.n+' (auto)',a:r.a});r.last=ym;ch=true}});if(ch)save()}

/* ---------- edit schema ---------- */
var SCH={
 exp:[['d','date','Date'],['c','cat','Category'],['n','text','What for'],['a','num','Amount ₹']],
 opening:[['n','text','Source'],['a','num','Amount ₹']],
 sip:[['n','text','Fund name'],['a','num','Monthly ₹']],
 mf:[['n','text','Fund name'],['i','num','Invested ₹'],['c','num','Current value ₹']],
 st:[['n','text','Stock name'],['i','num','Invested ₹'],['c','num','Current value ₹']],
 gold:[['d','date','Date'],['g','num','Gold (gm)'],['r','num','Rate ₹/gm'],['gst','num','GST %']],
 fds:[['n','text','Bank'],['a','num','Amount ₹'],['r','num','Rate % (optional)'],['s','date','Start date (optional)'],['m','date','Maturity date']],
 goals:[['n','text','Goal'],['t','num','Target ₹']],
 ins:[['n','text','Policy name'],['p','num','Premium per payment ₹'],['f','freq','Frequency'],['sa','num','Sum assured ₹'],['m','date','Maturity date']],
 rec:[['n','text','Name'],['c','cat','Category'],['a','num','Amount ₹'],['day','num','Day of month']],
 debts:[['n','text','Name'],['dir','dir','Direction'],['a','num','Amount ₹']],
 pay:[['d','date','Date'],['a','num','Amount ₹']],
 months:[['salary','num','Salary ₹'],['planned','num','Planned savings ₹'],['mexp','num','Emergency expense (from savings) ₹'],['budget','num','Monthly budget ₹']]
};
function fld(n,t,l,v){var val=v==null?'':v;
 if(t=='cat')return `<label class="lb">${l}<select name="${n}">${CATS.map(c=>`<option${c==val?' selected':''}>${c}</option>`).join('')}</select></label>`;
 if(t=='freq')return `<label class="lb">${l}<select name="${n}">${Object.keys(FQ).map(k=>`<option value="${k}"${k==(val||'yearly')?' selected':''}>${FQ[k][0]}</option>`).join('')}</select></label>`;
 if(t=='dir')return `<label class="lb">${l}<select name="${n}"><option value="owe"${val=='owe'?' selected':''}>I owe</option><option value="due"${val=='due'?' selected':''}>Owed to me</option></select></label>`;
 if(t=='date')return `<label class="lb">${l}<input name="${n}" type="date" value="${esc(val)}"></label>`;
 if(t=='num')return `<label class="lb">${l}<input name="${n}" type="number" inputmode="decimal" step="any" value="${esc(val)}"></label>`;
 return `<label class="lb">${l}<input name="${n}" type="text" value="${esc(val)}"></label>`}
function openEdit(k,i,j){var hasJ=j!==undefined&&j!==null&&j!=='';var sc=k=='months'?SCH.months:(hasJ?SCH.pay:SCH[k]);
 var o=k=='months'?getM(i):(hasJ?S[k][+i].pay[+j]:S[k][+i]);if(!sc||!o)return;
 var s=document.getElementById('sheet');
 s.firstElementChild.innerHTML=`<h2 style="margin-top:0">✏️ Edit</h2><form data-k="edit"><input type="hidden" name="_k" value="${k}"><input type="hidden" name="_i" value="${i}"><input type="hidden" name="_j" value="${hasJ?j:''}">${sc.map(f=>fld(f[0],f[1],f[2],o[f[0]])).join('')}<div style="width:100%;display:flex;gap:8px;margin-top:6px"><button class="btn">Save</button><button type="button" class="btn ghost" data-act="closesheet">Cancel</button></div></form>`;
 s.classList.add('open')}
function applyEdit(v){var k=v._k,i=v._i,j=v._j,hasJ=j!=='',sc=k=='months'?SCH.months:(hasJ?SCH.pay:SCH[k]);
 if(k=='months'&&isClosed(i)){toast('🔒 Ye month band hai');return false}
 var tgt=k=='months'?ensureM(i):(hasJ?S[k][+i].pay[+j]:S[k][+i]);
 if(k=='exp'&&(isClosed(tgt.d.slice(0,7))||isClosed(v.d.slice(0,7)))){toast('🔒 Ye month band hai, pehle Reopen karo');return false}
 sc.forEach(f=>{if(!(f[0] in v))return;var x=v[f[0]];tgt[f[0]]=f[1]=='num'?(+x||0):(f[1]=='text'?String(x).trim():x)});
 return true}

/* ---------- forms ---------- */
function expForm(d){return `<form data-k="exp" style="margin-top:0"><input name="d" type="date" value="${d||today()}" required><select name="c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><input name="n" placeholder="What for?" required><input name="a" type="number" inputmode="decimal" step="any" placeholder="Amount ₹" required><button class="btn">Add</button></form>`}

/* ---------- views ---------- */
function home(){
 var open=openingSum(),sav=savedToDate(),cs=open+sav,mc=sum(S.mf,x=>x.c),sc=sum(S.st,x=>x.c),gv=goldVal(),fv=sum(S.fds,fdNow),sip=sum(S.sip,x=>x.a),
 nw=cs+mc+sc+gv+fv,lv=Math.floor(Math.max(nw,0)/1e5)+1,xp=Math.max(nw,0)%1e5/1e3,
 res=S.reserve==null?100000:S.reserve,carSaved=cs-res,pct=S.target>0?Math.max(carSaved,0)/S.target*100:0,
 keys=allKeys(),ex=keys.map(k=>mExp(k)).filter(x=>x>0),av=ex.length?sum(ex)/ex.length:0,sh=av>0?cs/av:0,
 parts=[['Cash',cs,'--a1'],['Funds',mc,'--a2'],['Stocks',sc,'--a3'],['Gold',gv,'--go'],['FDs',fv,'--gr']],
 tt=sum(parts,p=>Math.max(p[1],0))||1,
 bs=[['💰','₹1L net worth',nw>=1e5],['🛡️','Shield 3 mo',sh>=3],['🎯','Budget boss',keys.some(k=>{var b=getM(k).budget;return b>0&&mExp(k)>0&&mExp(k)<=b})],['🧩','Diversified',parts.filter(p=>p[1]>0).length>=4],['🏆','Level 5',lv>=5]];
 var nag=(S.exp.length+S.opening.length+S.months.length+S.fds.length)>=5&&(!S.lastBackup||(Date.now()-new Date(S.lastBackup))/864e5>14);
 return `${nag?`<div class="warn">💾 Backup due. Last one: ${S.lastBackup?fmtD(S.lastBackup):'never'}. Export below.</div>`:''}
 <div class="hero"><div class="hr"><div><small>TOTAL NET WORTH</small><div class="big">${inr(nw)}</div></div><div class="ring" style="--p:${xp*3.6}deg"><b class="f">${lv}</b><small>LVL</small></div></div>
 <div class="stack">${parts.map(p=>p[1]>0?`<i style="width:${p[1]/tt*100}%;background:var(${p[2]})"></i>`:'').join('')}</div>
 <div class="leg">${parts.map(p=>`<span><u style="background:var(${p[2]})"></u>${p[0]}</span>`).join('')}</div>
 <small>${xp.toFixed(0)}% to Level ${lv+1} · next at ${inr(lv*1e5)}</small></div>

function chartBlock(){var ks=allKeys().filter(k=>k.slice(0,4)==String(Y));

 <div class="g2"><label>💸 Emergency expense (from savings)<input data-mex="${k}" type="number" inputmode="decimal" step="any" value="${o.mexp||''}" placeholder="0" ${cl?'disabled':''}></label><div class="kv" style="margin:0"><div><small>💎 Actual savings</small><b class="${cls(ac)}">${inr(ac)}</b></div></div></div>
 <div class="acts"><button data-act="edit" data-k="months" data-i="${k}">✏️ Edit</button>${cl?`<button data-act="reopen" data-i="${k}">🔓 Reopen</button>`:`<button data-act="closem" data-i="${k}">🔒 Close month</button>`}<button data-act="delm" data-i="${k}">🗑 Clear</button></div></div>`}).join('')
 +'<p class="mute">Actual savings = Planned savings − Emergency expense (jo yahan daala). Spend tab ke kharche yahan nahi judte. Net worth me current month tak ki actual savings jaati hai.</p>'}

function recBlock(){return `<h2>🔁 Recurring expenses</h2><div class="card">${S.rec.length?S.rec.map((r,i)=>`<div class="row"><div class="grow">${esc(r.n)}<small>${esc(r.c)} · every month, day ${r.day}</small></div><div class="amt">${inr(r.a)}</div>${del('rec',i)}</div>`).join(''):'<div class="empty">Rent, EMI, subscriptions: add once, auto every month.</div>'}</div>

 ${bd>0?bar(bp,over?'bad':bp>80?'pk':'gr'):''}

 +insBlock()+fdBlock()+hold('mf','📈 Mutual funds')+hold('st','📊 Stocks')+debtBlock()+goldBlock()}

var T=[['home','🏠','Base'],['months','📅','Months'],['spend','💸','Spend'],['invest','📈','Invest']];
function header(){return `<div class="top"><div class="tl"><div>🎮 LOOT <span>VAULT</span></div><button class="qa" data-act="fab" aria-label="Quick add expense">＋</button></div>
 <div class="status">${OK?'<i style="color:var(--gr)">●</i> Saved on this phone':'<i class="n">●</i> Not saving'} · ${new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</div>
 <div class="tabs">${T.map(t=>`<button data-act="tab" data-t="${t[0]}"${tab==t[0]?' class="on"':''}><span>${t[1]}</span>${t[2]}</button>`).join('')}</div></div>`}
function render(){
 document.documentElement.dataset.t=S.theme||'noir';
 document.getElementById('app').innerHTML=header()+({home,months,spend,invest})[tab]();
}
function go(t){tab=t;render();var A=document.getElementById('app');A.classList.remove('in');void A.offsetWidth;A.classList.add('in');scrollTo(0,0)}
function sheet(o){var s=document.getElementById('sheet');if(o)s.firstElementChild.innerHTML=`<h2 style="margin-top:0">⚡ Quick add expense</h2>`+expForm(today());s.classList.toggle('open',!!o)}

/* ---------- events ---------- */
document.addEventListener('submit',ev=>{var f=ev.target,k=f.dataset.k;if(!k)return;ev.preventDefault();var v=Object.fromEntries(new FormData(f));
 if(k=='edit'){if(!applyEdit(v))return}
 else if(k=='opening'||k=='sip')S[k].push({n:v.n.trim(),a:+v.a});
 else if(k=='exp'){if(isClosed(v.d.slice(0,7))){toast('🔒 Ye month band hai, pehle Reopen karo');return}S.exp.push({d:v.d,c:v.c,n:v.n.trim(),a:+v.a});selM=v.d.slice(0,7)}
 else if(k=='gold')S.gold.push({d:v.d,g:+v.g,r:+v.r,gst:+v.gst||0});
 else if(k=='mf'||k=='st')S[k].push({n:v.n.trim(),i:+v.i,c:v.c===''||v.c==null?+v.i:+v.c});
 else if(k=='months'){if(S.months.some(o=>o.k==v.k)){toast('Ye month pehle se hai');return}
   var prev=S.months.filter(o=>o.k<v.k).sort((a,b)=>a.k<b.k?1:-1)[0];
   S.months.push({k:v.k,salary:prev?prev.salary||0:0,planned:prev?prev.planned||0:0,budget:0});selM=v.k}
 else if(k=='rec'){S.rec.push({n:v.n.trim(),c:v.c,a:+v.a,day:+v.day||1,last:''});applyRec()}
 else if(k=='debts')S.debts.push({n:v.n.trim(),a:+v.a,p:0,dir:v.dir});
 else if(k=='fds')S.fds.push({n:v.n.trim(),a:+v.a,r:+v.r||0,s:v.s,m:v.m});
 else if(k=='ins')S.ins.push({n:v.n.trim(),p:+v.p,f:v.f||'yearly',sa:+v.sa||0,m:v.m||'',pay:[]});
 else if(k=='inspay')S.ins[+v.i].pay.push({d:v.d,a:+v.a});
 else if(k=='goals')S.goals.push({n:v.n.trim(),t:+v.t||1,s:0});
 save();sheet(false);render();toast(k=='edit'?'✏️ Updated':'✅ Saved')});

document.addEventListener('change',ev=>{var t=ev.target,d=t.dataset,v=+t.value||0;
 if(t.id=='msel'){selM=t.value;render();return}
 if(d.fq!==undefined)S.ins[+d.fq].f=t.value;
 else if(d.sal!==undefined){if(isClosed(d.sal))return;ensureM(d.sal).salary=v}
 else if(d.plan!==undefined){if(isClosed(d.plan))return;ensureM(d.plan).planned=v}
 else if(d.mex!==undefined){if(isClosed(d.mex))return;ensureM(d.mex).mexp=v}
 else if(t.id=='bud'){if(isClosed(selM||CUR()))return;ensureM(selM||CUR()).budget=v}
 else if(d.cv){var p=d.cv.split(',');S[p[0]][+p[1]].c=v}
 else if(d.gs!==undefined)S.goals[+d.gs].s=v;
 else if(t.id=='target')S.target=v;
 else if(t.id=='reserve')S.reserve=v;
 else if(d.dp!==undefined)S.debts[+d.dp].p=v;
 else if(t.id=='grate')S.goldRate=v;
 else if(t.id=='ggst')S.goldGst=v;
 else if(t.id=='file'&&t.files[0]){var r=new FileReader();r.onload=()=>{try{var x=JSON.parse(r.result);if(!x||!Array.isArray(x.exp))throw 0;S=migrate(x);save();render();toast('✅ Backup restored')}catch(e){toast('⚠️ Ye valid backup file nahi hai')}};r.readAsText(t.files[0]);return}
 else return;
 save();render()});

document.addEventListener('click',ev=>{if(ev.target.id=='sheet')return sheet(false);var b=ev.target.closest('[data-act]');if(!b)return;
 var a=b.dataset.act,k=b.dataset.k,i=b.dataset.i,j=b.dataset.j;
 if(a=='tab')go(b.dataset.t);
 if(a=='fab')sheet(true);
 if(a=='closesheet')return sheet(false);
 if(a=='edit')return openEdit(k,i,j);
 if(a=='del'){if(k=='exp'){var e=S.exp[+i];if(e&&isClosed(e.d.slice(0,7))){toast('🔒 Ye month band hai');return}}
   if(confirm('Ye entry delete karu?')){S[k].splice(+i,1);save();render();toast('🗑 Deleted')}}
 if(a=='delpay'&&confirm('Ye payment hatau?')){S[k][+i].pay.splice(+j,1);save();render();toast('🗑 Removed')}
 if(a=='delm'&&confirm('Is month ka salary, savings aur budget hata du? Expenses rahenge.')){S.months=S.months.filter(o=>o.k!=i);save();render()}
 if(a=='closem'&&confirm(mlabel(i)+' band kar du? Phir isme change nahi hoga (Reopen se khul sakta hai).')){S.closed.push(i);save();render();toast('🔒 '+mlabel(i)+' closed')}
 if(a=='reopen'){S.closed=S.closed.filter(x=>x!=i);save();render();toast('🔓 Reopened')}
 if(a=='mprev'||a=='mnext'){var L=allKeys(),ix=L.indexOf(selM||CUR()),n=L[ix+(a=='mprev'?-1:1)];if(n){selM=n;render()}}
 if(a=='paynow'){var p=S.ins[+i];if(p.pay.some(x=>x.d==today())&&!confirm('Aaj ka premium pehle hi daal chuka hai. Phir se add karu?'))return;p.pay.push({d:today(),a:p.p});save();render();toast('✅ Premium recorded')}
 if(a=='theme'){S.theme=b.dataset.t;save();render()}
 if(a=='export'){S.lastBackup=today();save();dl(JSON.stringify(S,null,1),'loot-vault-backup-'+today()+'.json','application/json');render()}
 if(a=='import')document.getElementById('file').click();
 if(a=='csv')downloadCSV()});

function dl(txt,name,type){var u=URL.createObjectURL(new Blob([txt],{type:type})),l=document.createElement('a');l.href=u;l.download=name;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function downloadCSV(){var rows=[['Section','Date','Name','Category','Amount','Extra']];
 S.exp.forEach(e=>rows.push(['Expense',e.d,e.n,e.c||'',e.a,'']));
 allKeys().forEach(k=>{var o=getM(k);rows.push(['Month',k,'Salary','',o.salary||0,'']);rows.push(['Month',k,'Planned savings','',o.planned||0,'']);rows.push(['Month',k,'Emergency expense','',o.mexp||0,'']);rows.push(['Month',k,'Actual savings','',actual(k),'Budget '+(o.budget||0)+(isClosed(k)?' (closed)':'')])});
 S.ins.forEach(p=>p.pay.forEach(x=>rows.push(['Insurance',x.d,p.n,'',x.a,p.f||'yearly'])));
 S.fds.forEach(f=>rows.push(['FD',f.m,f.n,'',f.a,(f.r||0)+'% from '+(f.s||'')]));
 S.mf.forEach(x=>rows.push(['Mutual fund','',x.n,'',x.c,'invested '+x.i]));
 S.st.forEach(x=>rows.push(['Stock','',x.n,'',x.c,'invested '+x.i]));
 S.sip.forEach(x=>rows.push(['SIP','',x.n,'',x.a,'monthly']));
 S.gold.forEach(x=>rows.push(['Gold',x.d,x.g+' gm','',x.g*x.r*(1+(x.gst||0)/100),'@ '+x.r+' + GST '+(x.gst||0)+'%']));
 S.debts.forEach(d=>rows.push(['Debt','',d.n,d.dir,d.a,'paid '+(d.p||0)]));
 S.opening.forEach(x=>rows.push(['Opening savings','',x.n,'',x.a,'']));
 var txt=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
 dl(txt,'loot-vault-'+today()+'.csv','text/csv')}

var tx,ty;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty,L=T.map(t=>t[0]),j=L.indexOf(tab)+(dx<0?1:-1);
 if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||Math.abs(dx)<80||Math.abs(dy)>60||document.getElementById('sheet').classList.contains('open'))return;if(L[j])go(L[j])},{passive:true});
document.addEventListener('keydown',e=>{if(e.key=='Escape')sheet(false)});

applyRec();render();
</script></body></html>
